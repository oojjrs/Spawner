<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spawner · 유닛 제작 현황</title><link rel="stylesheet" href="./client/neutral-stat-editor.css"><style>.preview-layout{display:grid;grid-template-columns:1fr 1fr;gap:24px}.preview-layout canvas{width:100%;aspect-ratio:1;background:radial-gradient(ellipse at 50% 72%,#324c35,#182b21 70%);border-radius:16px}.preview-controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.preview-controls label{display:grid;gap:6px;font-size:13px}.preview-controls select{max-width:100%}#status{white-space:pre-line}#budget{font-size:12px;font-variant-numeric:tabular-nums}#missing{color:#ddb57d;font-size:13px;line-height:1.8}button:disabled{opacity:.4;cursor:default}@media(max-width:660px){.preview-layout{grid-template-columns:1fr}}</style></head><body><main><header><a href="./Spawner.html">SPAWNER</a><div class="eyebrow">일체형 외형 · 제작 현황</div><h1>같은 몸체, 같은 크기,<br>이어지는 움직임.</h1><p>등록된 원화와 실제 제작된 동작을 확인합니다. 모든 필수 행동이 준비된 조합만 게임 전환 대상이 됩니다.</p><div class="reference" id="inventory"></div></header><section class="preview-layout"><div><canvas id="unit" aria-label="선택한 유닛 원화 또는 애니메이션"></canvas><p id="budget" aria-live="polite"></p></div><div><div class="preview-controls"><label>외형 조합<select id="form"></select></label><label>동작<select id="action"></select></label><button id="pause">일시정지</button><button id="replay">처음부터</button></div><p id="status" role="status"></p><p id="missing"></p><p>기본 원화는 고정 카메라로 표시합니다. 모션이 없는 동작을 대기로 대체하지 않습니다. 몸체 성장이나 지면 보정을 프레임마다 다시 적용하지 않습니다.</p><p id="event" role="status"></p></div></section><footer><a href="./NeutralStats.html">중립 스탯 곡선</a></footer></main><script src="./client/runtime.js"></script><script src="./client/assets.js"></script><script src="./client/unit-appearance-lazy-assets.js"></script><script src="./client/unit-appearance-preview-runtime.js"></script><script src="./client/unit-appearance-preview.js"></script></body></html>
