:33},{"gene":"area","grade":3,"steps":[0,1,0,5],"order":5},{"gene":"areaPower","grade":4,"steps":[0,1,0,2,3],"order":35},{"gene":"lifesteal","grade":4,"steps":[0,1,0,5,4],"order":36},{"gene":"reflection","grade":4,"steps":[0,1,2,1,3],"order":37},{"gene":"regeneration","grade":4,"steps":[0,1,0,1,2],"order":38},{"gene":"comboSpeed","grade":4,"steps":[0,1,2,3,4],"order":39},{"gene":"focus","grade":4,"steps":[0,2,0,1,5],"order":40},{"gene":"healer","grade":2,"steps":[0,2,1],"order":6},{"gene":"secretion","grade":2,"steps":[0,1,3],"order":3},{"gene":"rangedPower","grade":2,"steps":[0,0,2],"order":4},{"gene":"rangedSpeed","grade":2,"steps":[0,0,4],"order":5},{"gene":"healPower","grade":2,"steps":[0,4,4],"order":7}];

function renderDnaComposition(container, M, dna) {

    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
