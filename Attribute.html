const AGENT_LIFESPAN = 300;
const AGENT_LIFESPAN_BONUS = 120;
const AGENT_DEATH_WARNING = 60;

function agentRemainingLifespan(agent, time) {
  if (!Number.isFinite(agent.lifespan) || agent.lifespan <= 0) return Infinity;
  return Math.max(0, agent.lifespan - Math.max(0, time - (agent.lifespanStartedAt ?? agent.bornAt)));
}

return { AGENT_LIFESPAN, AGENT_LIFESPAN_BONUS, AGENT_DEATH_WARNING, agentRemainingLifespan };

modules["server/unit-recovery.mjs"] = (() => {
// Pure numbers shared by combat and design previews. Neutral ownership and
// recovery eligibility remain the responsibility of the combat engine.
const UNIT_RECOVERY_RULES = Object.freeze({ delay: 5, base: .05, healthFraction: .005, scaledCap: .3 });

function basicRecoveryRate(maxHealth) {
  return Number.isFinite(maxHealth) && maxHealth > 0 ? UNIT_RECOVERY_RULES.base +
    Math.min(maxHealth * UNIT_RECOVERY_RULES.healthFraction, UNIT_RECOVERY_RULES.scaledCap) : 0;
}

function totalRecoveryRate(maxHealth, additional = 0) {
  return basicRecoveryRate(maxHealth) + (Number.isFinite(additional) ? Math.max(0, additional) : 0);
}

return { UNIT_RECOVERY_RULES, basicRecoveryRate, totalRecoveryRate };
})();
modules["client/dna-audio.mjs"] = (() => {
function createDnaAudio() {
  const sounds = new Map();
  if (typeof Audio === "function") {
    for (const action of ["place", "remove", "rotate"]) {
      const audio = new Audio("DesignAssets/Audio/DnaV2/dna-" + action + ".wav");
      audio.preload = "auto";
      audio.volume = 0.65;
      sounds.set(action, audio);
    }
  }
  function stop() {
    for (const audio of sounds.values()) audio.pause();
  }
  function visibility() {
    if (document.hidden) stop();
  }
  document.addEventListener?.("visibilitychange", visibility);
  return {
    play(action) {
      const audio = sounds.get(action);
      if (!audio || document.hidden) return;
      audio.currentTime = 0;
      audio.play().catch(() => {});
    },
    destroy() {
      stop();
      document.removeEventListener?.("visibilitychange", visibility);
      sounds.clear();
    }
  };
}

return { createDnaAudio };
})();
