  function setupTable(root, fields, table) {
  const body = table.tBodies[0];
  const headers = [...table.tHead.rows[0].cells];
  const buttons = headers.map(header => header.querySelector("button"));
  buttons.forEach((button, column) => {
    button.dataset.column = String(column);
    button.dataset.field = fields[column];
  });
  const rows = [...body.rows].map((row, index) => ({ row, index }));
  const masterWrap = table.parentElement;
  const groups = [];
  const columnWidths = document.createElement("colgroup");
  fields.forEach((field, index) => {
    const column = document.createElement("col");
    if (index === 0) column.style.width = "88px";
    if (field === "role") column.style.width = "92px";
    columnWidths.append(column);
  });
  table.prepend(columnWidths);
  function rebuildGroups() {
    const width = root.clientWidth;
    if (!width) return;
    const count = width >= 1600 ? 0 : Math.max(2, Math.min(12, Math.floor((width - 80) / 64)));
    if (Number(root.dataset.groupSize) === count) return;
    root.dataset.groupSize = String(count);
    groups.splice(0).forEach(group => group.wrap.remove());
    masterWrap.hidden = count > 0;
    if (!count) return;
    for (let start = 1; start < fields.length; start += count) {
      const indices = [0, ...fields.slice(start, start + count).map((field, offset) => start + offset)];
      const wrap = document.createElement("div");
      wrap.className = "table-responsive tier-group";
      const groupTable = document.createElement("table");
      groupTable.className = table.className;
      const cols = document.createElement("colgroup");
      indices.forEach((column, index) => {
        const col = document.createElement("col");
        if (index === 0) col.style.width = "80px";
        if (fields[column] === "role") col.style.width = "92px";
        cols.append(col);
      });
      const head = groupTable.createTHead().insertRow();
      indices.forEach(column => head.append(headers[column].cloneNode(true)));
      const groupBody = groupTable.createTBody();
      const groupRows = new Map();
      rows.forEach(entry => {
        const row = document.createElement("tr");
        indices.forEach(column => row.append(entry.row.cells[column].cloneNode(true)));
        row.querySelectorAll("[id]").forEach(element => { element.id += "-group-" + start; });
        row.querySelectorAll("[aria-labelledby]").forEach(element => {
          element.setAttribute("aria-labelledby", element.getAttribute("aria-labelledby").split(" ").map(id => id + "-group-" + start).join(" "));
        });
        groupRows.set(entry.index, row);
        groupBody.append(row);
      });
      groupTable.prepend(cols);
      wrap.append(groupTable);
      root.append(wrap);
      groups.push({ wrap, table: groupTable, body: groupBody, rows: groupRows });
    }
    render(current);
  }
  const collator = new Intl.Collator("ko");
  let current = null;

  function validSort(value) {
    return value && Number.isInteger(value.column) && value.column >= 0 && value.column < fields.length &&
      (value.direction === "ascending" || value.direction === "descending");
  }

  function render(sort) {
    current = validSort(sort) ? { column: sort.column, direction: sort.direction } : null;
    const ordered = [...rows];
    if (current) {
      const { column, direction } = current;
      ordered.sort((left, right) => {
        const a = left.row.cells[column].dataset.value ?? left.row.cells[column].textContent;
        const b = right.row.cells[column].dataset.value ?? right.row.cells[column].textContent;
        const order = fields[column] !== "name" && fields[column] !== "role" ? Number(a) - Number(b) : collator.compare(a, b);
        return (direction === "ascending" ? order : -order) || left.index - right.index;
      });
    }
    body.append(...ordered.map(entry => entry.row));
    groups.forEach(group => group.body.append(...ordered.map(entry => group.rows.get(entry.index))));
    [...headers, ...groups.flatMap(group => [...group.table.tHead.rows[0].cells])].forEach(header => {
      const column = Number(header.querySelector("button").dataset.column);
      const direction = current && current.column === column ? current.direction : "none";
      header.setAttribute("aria-sort", direction);
      header.querySelector("button span").textContent = direction === "ascending" ? "↑" : direction === "descending" ? "↓" : "↕";
    });
  }

  root.addEventListener("click", event => {
    const button = event.target.closest("button[data-column]");
    if (!button || !root.contains(button)) return;
    const column = Number(button.dataset.column);
    const direction = current && current.column === column && current.direction === "ascending" ? "descending" : "ascending";
    render({ column, direction });
  });
  render(null);
  new ResizeObserver(rebuildGroups).observe(root);
  rebuildGroups();
  }
