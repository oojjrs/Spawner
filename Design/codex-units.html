<body data-design-page="codex-units"><main><details class="section-group is-page-active" data-section-group="codex" open><summary hidden></summary><div class="section-group-body"><details open class="is-page-active" id="codex-units"><summary></summary><div class="details-body unit-matrix-body">

</div></details>
<script src="client/combat-audio.js"></script>

<script id="unit-matrix-playback">
document.addEventListener('DOMContentLoaded',()=>{
const lightbox=document.getElementById('image-lightbox'),image=lightbox.querySelector('.lightbox-image');
let frame=null,panel=null;
function stopSounds(){if(panel)for(const sound of panel.sounds){for(const voice of sound.voices){voice.audio.pause();voice.audio.currentTime=0}sound.playing=false}}
function clearPanel(){if(frame!==null)cancelAnimationFrame(frame);frame=null;stopSounds();if(panel)panel.canvas.width=panel.canvas.height=1;panel=null}
function schedule(){if(frame===null&&panel?.ready&&!document.hidden&&lightbox.classList.contains('is-open'))frame=requestAnimationFrame(paint)}
function playSounds(elapsed){
const period=panel.duration+panel.rest,previous=panel.audioElapsed,time=elapsed%period;panel.audioElapsed=elapsed;
for(const sound of panel.sounds){
if(sound.loop){if(time<panel.duration){if(!sound.playing){sound.playing=true;sound.voices[0].audio.play().catch(()=>{})}}else if(sound.playing){sound.voices[0].audio.pause();sound.voices[0].audio.currentTime=0;sound.playing=false}continue}
for(let cycle=Math.max(0,Math.floor(previous/period));cycle<=Math.floor(elapsed/period);cycle++)for(const at of sound.times){
const due=cycle*period+at;if(due<=previous||due>elapsed||elapsed-due>120)continue;
const voice=sound.voices.find(voice=>voice.audio.paused||voice.audio.ended)||sound.voices[sound.next++%sound.voices.length];
voice.audio.currentTime=0;voice.audio.play().catch(()=>{});
}
}
}
function paint(now){
frame=null;if(!panel?.ready||!lightbox.classList.contains('is-open'))return;
const elapsed=Math.max(0,now-panel.started),time=elapsed%(panel.duration+panel.rest);
let index=panel.ends.findIndex(end=>time<end);if(index<0)index=panel.ends.length-1;
if(panel.nativeAnimation){panel.index=index;image.dataset.frame=String(index)}else if(index!==panel.index||globalThis.SpawnerUnitMatrixCanvasNeedsResize?.(panel.canvas,panel.runtimeGeometry?256:image.naturalWidth/panel.columns)){panel.index=index;const geometry=panel.runtimeGeometry?{...panel.runtimeGeometry,...panel.runtimeGeometry.frameGeometry?.[panel.frames?.[index]??index]}:null,size=geometry?.frameSize||image.naturalWidth/panel.columns,context=panel.context,scale=geometry?panel.runtimeScale:panel.scale,extent=geometry?256:size,left=geometry?128-geometry.pivotX*scale:size*(1-scale)/2,top=geometry?208-geometry.pivotY*scale:size*(panel.floor-panel.pivotY*scale);globalThis.SpawnerUnitMatrixPrepareCanvas(panel.canvas,context,extent);if(panel.mirror){context.translate(extent,0);context.scale(-1,1)}const frame=panel.frames?.[index]??index;context.drawImage(image,frame%panel.columns*size,Math.floor(frame/panel.columns)*size,size,size,left,top,size*scale,size*scale);globalThis.SpawnerUnitMatrixProjectile?.(context,geometry,scale,time);panel.canvas.dataset.frame=String(index)}
playSounds(elapsed);schedule();
}
async function startPanel(current){
const generation=++current.generation;current.ready=false;
try{
await image.decode();
if(panel!==current||current.generation!==generation||document.hidden||!lightbox.classList.contains('is-open'))return;
if(current.nativeAnimation){image.src=current.source+(current.source.includes('?')?'&':'?')+'play='+performance.now();await image.decode();if(panel!==current||current.generation!==generation||document.hidden||!lightbox.classList.contains('is-open'))return}
current.ready=true;current.started=performance.now();current.audioElapsed=-1;current.index=-1;schedule();
}catch{}
}
document.addEventListener('click',event=>{
const link=event.target.closest('figure a');if(!link||event.ctrlKey||event.metaKey||event.shiftKey||event.altKey||event.button!==0)return;
clearPanel();lightbox.classList.remove('is-unit-animation','is-unit-mirrored');if(!link.closest('#codex-units,#codex-nest,#codex-unit-appearance'))return;
const element=link.querySelector('.unit-matrix-preview')||(link.dataset.runtimeGeometry?link:null);if(!element)return;
const mirror=element.dataset.mirror==='true';lightbox.classList.toggle('is-unit-mirrored',mirror);if(!element.dataset.durations)return;
const nativeAnimation=element.dataset.nativeAnimation==='true';lightbox.classList.toggle('is-unit-animation',!nativeAnimation);let canvas=document.getElementById('unit-lightbox-canvas');if(!canvas){canvas=document.createElement('canvas');canvas.id='unit-lightbox-canvas';image.after(canvas)}
canvas.width=canvas.height=64;canvas.dataset.frame='-1';const context=canvas.getContext('2d'),thumbnail=element.querySelector('img'),scale=Number(element.dataset.previewScale||1),pivotY=Number(element.dataset.previewPivotY||.875),floor=Number(element.dataset.previewFloor||.875);if(thumbnail.complete&&thumbnail.naturalWidth){if(element.classList.contains('is-mirrored')){context.translate(64,0);context.scale(-1,1)}context.drawImage(thumbnail,64*(1-scale)/2,64*(floor-pivotY*scale),64*scale,64*scale)}
let duration=0;const ends=element.dataset.durations.split(',').map(value=>duration+=Number(value));
const combat=globalThis.SpawnerCombatAudio,combatCue=element.dataset.combatAction?combat.cue(element.dataset.combatMaterial,element.dataset.combatAction,1):null;
const cues=combatCue?[{src:combat.sources[combatCue.name],times:[combatCue.at*1000]}]:element.dataset.audioCues?JSON.parse(element.dataset.audioCues):element.dataset.audio?[{src:element.dataset.audio,times:[Number(element.dataset.audioStart||0)]}]:[];
const sounds=cues.map(cue=>{
const voices=Array.from({length:cue.loop===true?1:3},()=>{
const audio=new Audio();audio.preload='auto';audio.loop=cue.loop===true;audio.volume=cue.volume??1;
const ready=new Promise(resolve=>{audio.addEventListener('loadeddata',resolve,{once:true});audio.addEventListener('error',resolve,{once:true})});
audio.src=cue.src;audio.load();return {audio,ready};
});
return {voices,times:cue.times,loop:cue.loop===true,next:0,playing:false};
});
const current=panel={canvas,context,runtimeGeometry:element.dataset.runtimeGeometry?JSON.parse(element.dataset.runtimeGeometry):null,runtimeScale:Number(element.dataset.runtimeScale||1),nativeAnimation,source:link.href,frames:element.dataset.frames?.split(',').map(Number),columns:Number(element.dataset.columns),ends,duration,rest:element.dataset.loop==='true'?0:900,mirror,scale,pivotY,floor,index:-1,ready:false,started:0,audioElapsed:-1,generation:0,sounds};
image.decoding='async';startPanel(current);
});
new MutationObserver(()=>{if(!lightbox.classList.contains('is-open'))clearPanel()}).observe(lightbox,{attributes:true,attributeFilter:['class']});
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(frame!==null){cancelAnimationFrame(frame);frame=null}stopSounds();if(panel){panel.ready=false;panel.generation++}}else if(panel)startPanel(panel)});
});
</script></div></details></main><div class="lightbox" id="image-lightbox" aria-hidden="true">
