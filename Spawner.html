<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spawner</title>
  <style>
    :root {
      color-scheme: dark;
      --agent-panel-width: clamp(min(220px, 55vw), 280px, 70vw);
      --bg: #101315;
      --panel: #171d20;
      --panel-2: #20282b;
      --ink: #e4e9ea;
      --muted: #9aa7aa;
      --line: #314044;
      --accent: #75c4b6;
      --amber: #d6b26b;
      --danger: #c06b62;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: Arial, "Malgun Gothic", sans-serif;
      overflow: hidden;
    }

    .app {
      display: grid;
      grid-template-rows: 1fr;
      height: 100vh;
      padding-right: var(--agent-panel-width);
    }

    .stage {
      position: relative;
      display: grid;
      place-items: center;
      min-width: 0;
      min-height: 0;
      background:
        radial-gradient(circle at 50% 50%, rgba(117, 196, 182, 0.08), transparent 36%),
        linear-gradient(180deg, #111719, #0d1012);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100vh;
      border: 0;
      background: #111619;
      image-rendering: crisp-edges;
      outline: none;
    }

    .colony-focus-button {
      min-width: 88px;
      height: 32px;
      padding: 0 14px;
      border: 1px solid #75c4b65c;
      border-radius: 999px;
      background: rgba(18, 25, 27, 0.88);
      color: #c8d7d5;
      font-size: 0.76rem;
      cursor: pointer;
      box-shadow: 0 6px 18px #0006;
    }
    .colony-focus-button:hover { border-color: #75c4b6a8; background: #1b2d2d; color: #ecf5f3; }
    .colony-focus-button:focus-visible { outline: 2px solid #75c4b6; outline-offset: 2px; }
    .controls-guide {
      position: fixed; right: calc(var(--agent-panel-width) + 16px); bottom: 64px; z-index: 3;
      width: 218px; padding: 12px;
      border: 1px solid #ffffff1f; border-radius: 9px;
      background: rgba(18, 25, 27, 0.94); box-shadow: 0 8px 24px #0006;
    }
    .controls-guide h2 { margin: 0; color: var(--muted); font-size: 0.76rem; font-weight: 500; }
    .controls-guide .panel-header { margin-bottom: 8px; }
    .controls-guide .panel-close { width: 24px; height: 24px; }
    .controls-guide ul { display: grid; gap: 9px; margin: 0; padding: 0; list-style: none; }
    .controls-guide li { display: flex; align-items: center; gap: 10px; font-size: 0.78rem; }
    .controls-guide svg { flex: 0 0 32px; width: 32px; height: 36px; color: var(--accent); }
    .controls-guide small { display: block; margin-top: 3px; color: var(--muted); font-size: 0.68rem; }
    .controls-guide-toggle { position: fixed; right: calc(var(--agent-panel-width) + 16px); bottom: 16px; z-index: 3; }
    .controls-guide[hidden], .controls-guide-toggle[hidden] { display: none; }
    .controls-guide .panel-close:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .agent-panel {
      position: fixed; top: 0; right: 0; bottom: 0; z-index: 4;
      display: flex; flex-direction: column; width: var(--agent-panel-width);
      padding: 16px 12px; border-left: 1px solid var(--line);
      background: var(--panel);
    }
    .agent-panel h2 { flex: none; margin: 0 0 12px; font-size: 0.9rem; }
    .agent-panel-scroll { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; scrollbar-gutter: stable; }
    .agent-panel-resize { position: absolute; top: 0; bottom: 0; left: -5px; width: 10px; cursor: col-resize; touch-action: none; z-index: 1; }
    .agent-panel-resize::after { position: absolute; top: 0; bottom: 0; left: 4px; width: 2px; background: var(--line); content: ""; }
    .agent-panel-resize:hover::after, .agent-panel-resize:focus-visible::after { background: var(--accent); }
    .agent-panel-resize:focus-visible { outline: none; }
    .agent-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 7px; }
    .agent-item { display: grid; justify-items: center; gap: 3px; min-width: 0; min-height: 98px; padding: 7px 5px; border: 1px solid #314044; border-radius: 8px; background: #ffffff08; color: #e4e9ea; text-align: center; cursor: pointer; }
    .agent-item:hover { border-color: #75c4b688; background: #75c4b612; }
    .agent-item img { width: 52px; height: 52px; object-fit: contain; image-rendering: pixelated; }
    .agent-item span { max-width: 100%; overflow: hidden; color: #dce4e2; font-size: 0.72rem; text-overflow: ellipsis; white-space: nowrap; }
    .agent-item small { color: #9aa7aa; font-size: 0.66rem; }
    .agent-item.is-selected { border-color: #f4f7fa; background: #f4f7fa16; box-shadow: inset 0 0 0 1px #f4f7fa44; }
    .panel-tabs { display: flex; flex: none; gap: 4px; margin-bottom: 16px; border-bottom: 1px solid var(--line); }
    .panel-tabs button { flex: 1; padding: 10px 6px; border: 0; border-bottom: 2px solid transparent; background: transparent; color: var(--muted); font: inherit; font-size: 0.86rem; cursor: pointer; }
    .panel-tabs button[aria-selected="true"] { border-bottom-color: var(--accent); color: var(--ink); }
    .panel-tabs button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
    .agent-panel-scroll[hidden], .evolution-panel[hidden] { display: none; }
    .colony-browser { display: flex; flex-direction: column; height: 100%; min-height: 0; gap: 10px; }
    .colony-search { width: 100%; padding: 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); }
    .colony-list { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; display: flex; flex-direction: column; gap: 6px; }
    .colony-item { flex: none; display: grid; gap: 5px; width: 100%; padding: 10px; border: 1px solid var(--line); border-radius: 6px; background: #ffffff08; color: var(--ink); text-align: left; cursor: pointer; }
    .colony-item strong { overflow-wrap: anywhere; }
    .colony-item small, .colony-results { color: var(--muted); font-size: 0.72rem; }
    .colony-item:hover { border-color: var(--accent); background: #75c4b612; }
    .colony-item[aria-current="true"] { border-color: #f4f7fa; background: #f4f7fa16; box-shadow: inset 0 0 0 1px #f4f7fa44; }
    .colony-item:focus-visible, .colony-search:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
    .colony-pages { display: flex; align-items: center; justify-content: space-between; gap: 6px; font-size: 0.72rem; }
    .colony-pages button { min-width: 0; padding: 0 10px; }
    .colony-pages button:disabled { opacity: 0.35; cursor: default; }
    .colony-empty { color: var(--muted); font-size: 0.8rem; }
    .colony-stats { flex-wrap: wrap; }
    .colony-menu, .evolution-panel {
      position: fixed; z-index: 5; width: 260px; max-height: calc(100vh - 20px);
      padding: 14px; overflow-x: hidden; overflow-y: auto;
      border: 1px solid var(--line); border-radius: 10px;
      background: rgba(18, 25, 27, 0.96); box-shadow: 0 18px 52px #0009;
    }
    .colony-menu[hidden], .evolution-panel[hidden] { display: none; }
    .colony-menu > .panel-header { margin-bottom: 12px; }
    .evolution-panel { width: 240px; padding: 12px; }
    .evolution-panel .panel-header h2 { font-size: 0.9rem; }
    .evolution-traits { display: grid; gap: 6px; margin-bottom: 14px; }
    .evolution-trait { display: flex; align-items: center; gap: 8px; }
    .evolution-traits [data-evolution] { flex: 1; min-width: 0; display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 9px; border: 1px solid var(--line); border-radius: 6px; background: #ffffff08; color: var(--ink); text-align: left; cursor: pointer; }
    .evolution-traits small { display: block; margin-top: 4px; color: var(--muted); }
    .evolution-traits [data-evolution][aria-pressed="true"] { border-color: var(--accent); background: #75c4b618; }
    .evolution-traits strong { color: var(--accent); }
    .evolution-traits [data-evolution]:disabled { opacity: 0.5; cursor: default; }
    .evolution-stat-row { display: flex; align-items: center; gap: 8px; margin: 2px 0 12px; }
    .evolution-stat-row .evolution-stat { flex: 1; min-width: 0; margin: 0; }
    .help-button { display: inline-grid; flex: none; place-items: center; width: 22px; height: 22px; padding: 0; border: 1px solid #75c4b67a; border-radius: 50%; background: transparent; color: var(--accent); font: inherit; font-size: 0.75rem; cursor: help; }
    .help-button:hover, .help-button:focus-visible { border-color: var(--accent); background: #75c4b618; outline: 1px solid var(--accent); outline-offset: 2px; }
    .help-tooltip { position: fixed; z-index: 20; width: min(280px, calc(100vw - 20px)); padding: 12px; border: 1px solid #75c4b64a; border-radius: 8px; background: #101719fa; box-shadow: 0 8px 24px #0009; color: #d7e0df; font-size: 0.76rem; line-height: 1.65; white-space: pre-line; overflow-wrap: anywhere; pointer-events: none; }
    .help-tooltip[hidden], .agent-details[hidden] { display: none; }
    .agent-details { position: sticky; top: 0; z-index: 1; background: var(--panel); margin-bottom: 18px; padding-bottom: 16px; border-bottom: 1px solid var(--line); }
    .agent-details h2 { overflow-wrap: anywhere; }
    .agent-details label { display: block; margin-bottom: 6px; color: var(--muted); font-size: 0.76rem; }
    .agent-name-controls { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px; }
    .agent-name-controls input { width: 100%; min-width: 0; padding: 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); font: inherit; font-size: 0.8rem; }
    .agent-name-controls button { padding: 0 10px; border: 1px solid #75c4b65c; border-radius: 6px; background: #75c4b612; color: var(--ink); font: inherit; font-size: 0.76rem; cursor: pointer; }
    .agent-name-controls input:focus-visible, .agent-name-controls button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .agent-name-status { min-height: 1em; margin: 6px 0 0; color: var(--muted); font-size: 0.72rem; }
    .agent-item strong { max-width: 100%; overflow: hidden; font-size: 0.75rem; text-overflow: ellipsis; white-space: nowrap; }
    .evolution-stat { width: 100%; font-family: inherit; cursor: pointer; }
    .evolution-stat:hover, .evolution-stat[aria-expanded="true"] { border-color: var(--accent); background: #75c4b618; }
    .evolution-stat:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .panel-header,
    .colony-stats {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .panel-header h2 {
      margin: 0;
      font-size: 1rem;
    }

    .panel-close {
      width: 28px;
      height: 28px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #ffffff0a;
      color: var(--ink);
      cursor: pointer;
    }

    .panel-note {
      margin: 7px 0 13px;
      color: var(--muted);
      font-size: 0.8rem;
    }

    .colony-stats {
      margin-bottom: 14px;
      padding: 9px 10px;
      border: 1px solid var(--line);
      border-radius: 7px;
      color: var(--accent);
      font-size: 0.82rem;
    }


    .food-progress-stat {
      flex: 1;
      font-variant-numeric: tabular-nums;
    }
    .evolution-stat {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 2px 0 12px;
      padding: 8px 10px;
      border: 1px solid #75c4b63d;
      border-radius: 7px;
      background: #75c4b60a;
      color: var(--muted);
      font-size: 0.82rem;
    }
    .evolution-stat strong { color: var(--accent); font-variant-numeric: tabular-nums; }

    .food-progress-track {
      width: 100%;
      height: 6px;
      margin: -7px 0 14px;
      overflow: hidden;
      border-radius: 999px;
      background: #0d1214;
      box-shadow: inset 0 0 0 1px #ffffff12;
    }

    .food-progress-fill {
      display: block;
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #8b754c, var(--amber));
      transition: width 160ms ease;
    }
  </style>
</head>
<body>
  <div class="app">
    <main class="stage">
      <canvas id="world" width="1200" height="760" tabindex="0" aria-label="Spawner world canvas"></canvas>
    </main>
    <aside class="controls-guide" id="controls-guide" aria-labelledby="controls-guide-title">
      <div class="panel-header">
        <h2 id="controls-guide-title">마우스 조작</h2>
        <button class="panel-close" id="controls-guide-close" type="button" aria-label="조작 안내 닫기">×</button>
      </div>
      <ul>
        <li>
          <svg viewBox="0 0 32 36" role="img" aria-label="마우스 휠">
            <rect x="7" y="3" width="18" height="30" rx="9" fill="none" stroke="#9aa7aa" stroke-width="1.5"/>
            <path d="M7 16h18M16 3v6" fill="none" stroke="#9aa7aa" stroke-width="1.5"/>
            <rect x="14" y="8" width="4" height="10" rx="2" fill="currentColor"/>
            <path d="m1 12 2-3 2 3m-4 12 2 3 2-3M3 9v18" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span>확대 · 축소<small>휠 위 · 아래로 굴리기</small></span>
        </li>
        <li>
          <svg viewBox="0 0 32 36" role="img" aria-label="마우스 왼쪽 버튼 드래그">
            <path d="M16 3a9 9 0 0 0-9 9v4h9Z" fill="currentColor" opacity=".75"/>
            <rect x="7" y="3" width="18" height="30" rx="9" fill="none" stroke="#9aa7aa" stroke-width="1.5"/>
            <path d="M7 16h18M16 3v13m-5 10-3-3 3-3m10 0 3 3-3 3M8 23h16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span>화면 이동<small>왼쪽 버튼을 누른 채 드래그</small></span>
        </li>
        <li>
          <svg viewBox="0 0 32 36" role="img" aria-label="마우스 왼쪽 버튼 클릭">
            <path d="M16 3a9 9 0 0 0-9 9v4h9Z" fill="currentColor" opacity=".75"/>
            <rect x="7" y="3" width="18" height="30" rx="9" fill="none" stroke="#9aa7aa" stroke-width="1.5"/>
            <path d="M7 16h18M16 3v13M3 3l2 2M2 10h3M10 0v2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <span>개체 선택<small>생명체 목록에서 왼쪽 클릭</small></span>
        </li>
      </ul>
    </aside>
    <button class="colony-focus-button controls-guide-toggle" id="controls-guide-toggle" type="button" aria-controls="controls-guide" aria-expanded="true" hidden>조작 안내</button>
    <aside class="agent-panel" id="agent-panel" aria-label="생명체 및 둥지">
      <div class="agent-panel-resize" id="agent-panel-resize" role="separator" tabindex="0" aria-label="오른쪽 패널 너비" aria-orientation="vertical" aria-controls="agent-panel"></div>
      <div class="panel-tabs" role="tablist" aria-label="정보 패널">
        <button id="agent-tab" type="button" role="tab" aria-selected="true" aria-controls="agent-tab-panel">생명체</button>
        <button id="colony-tab" type="button" role="tab" aria-selected="false" aria-controls="colony-panel" tabindex="-1">둥지</button>
      </div>
      <section class="agent-panel-scroll" id="agent-tab-panel" role="tabpanel" aria-labelledby="agent-tab" tabindex="0">
        <section class="agent-details" id="agent-details" aria-label="선택한 생명체" hidden>
          <h2 id="selected-agent-name"></h2>
          <form id="agent-name-form">
            <label for="agent-name-input">이름</label>
            <div class="agent-name-controls">
              <input id="agent-name-input" type="text" maxlength="24" required autocomplete="off">
              <button type="submit">변경</button>
            </div>
            <p class="agent-name-status" id="agent-name-status" role="status"></p>
          </form>
        </section>
        <h2>생명체 <span id="agent-list-count">1</span></h2>
        <div class="agent-list" id="agent-list"></div>
      </section>
      <section class="agent-panel-scroll colony-panel" id="colony-panel" role="tabpanel" aria-labelledby="colony-tab" tabindex="0" hidden>
      <section class="colony-browser" id="colony-browser" aria-label="둥지 목록">
        <input class="colony-search" id="colony-search" type="search" placeholder="둥지 이름·번호 검색" aria-label="둥지 이름 또는 번호 검색">
        <span class="colony-results" id="colony-results" role="status"></span>
        <div class="colony-list" id="colony-list"></div>
        <nav class="colony-pages" aria-label="둥지 목록 페이지">
          <button class="colony-focus-button" id="colony-previous" type="button">이전</button>
          <span id="colony-page"></span>
          <button class="colony-focus-button" id="colony-next" type="button">다음</button>
        </nav>
      </section>
      </section>
    </aside>
  </div>

  <aside class="colony-menu" id="colony-menu" aria-label="둥지 메뉴" hidden>
    <div class="panel-header">
      <h2>둥지</h2>
      <button class="panel-close" id="colony-menu-close" type="button" aria-label="둥지 메뉴 닫기">×</button>
    </div>
      <div class="colony-stats">
        <span class="food-progress-stat">먹이 <strong id="stored-food">0</strong> / <strong id="birth-cost">5</strong></span>
        <span>개체 <strong id="agent-count">1</strong></span>
      </div>
      <div class="food-progress-track" aria-label="다음 생명체 탄생 먹이 진행도">
        <i class="food-progress-fill" id="food-progress-fill"></i>
      </div>
      <div class="evolution-stat-row">
      <button class="evolution-stat" id="evolution-open-button" type="button" aria-controls="evolution-panel" aria-expanded="false">
        <span>진화 포인트</span>
        <strong><span id="evolution-points">0</span>점 <span aria-hidden="true" style="margin-left: 8px;">›</span></strong>
      </button>
      <button class="help-button" type="button" aria-label="진화 포인트 설명" data-help="개체가 새로 태어날 때마다 진화 포인트가 1점 늘어납니다.&#10;처음 주어진 개체의 1점을 포함해 1점으로 시작합니다.&#10;현재 세 진화는 적용과 해제에 포인트를 쓰지 않습니다.">?</button>
      </div>
    </aside>
      <section class="evolution-panel" id="evolution-panel" aria-label="진화" hidden>
      <div class="panel-header">
        <h2>진화</h2>
        <button class="panel-close" id="evolution-close" type="button" aria-label="진화 닫기">×</button>
      </div>
      <p class="panel-note">다음 탄생부터 적용 · 0포인트</p>
      <div class="evolution-traits">
        <div class="evolution-trait">
          <button type="button" data-evolution="antenna" aria-pressed="false"><span><span class="evolution-name">시야 확장</span><small>시야 1 → 3칸</small></span><strong>미적용</strong></button>
          <button class="help-button" type="button" aria-label="시야 확장 설명" data-help="먹이를 발견하는 시야가 반경 1칸에서 3칸으로 넓어집니다.&#10;새싹 중앙에 감각 기관이 자라 더 멀리 있는 먹이를 찾습니다.&#10;다음에 태어나는 개체부터 적용되며, 기존 개체는 변하지 않습니다.">?</button>
        </div>
        <div class="evolution-trait">
          <button type="button" data-evolution="arms" aria-pressed="false"><span><span class="evolution-name">운반 강화</span><small>운반 1 → 3개</small></span><strong>미적용</strong></button>
          <button class="help-button" type="button" aria-label="운반 강화 설명" data-help="한 번에 가져오는 먹이량이 1개에서 최대 3개로 늘어납니다.&#10;짧은 잎으로 쟁반을 높이 들며, 먹이가 부족하면 남은 만큼만 가져옵니다.&#10;다음에 태어나는 개체부터 적용되며, 기존 개체는 변하지 않습니다.">?</button>
        </div>
        <div class="evolution-trait">
          <button type="button" data-evolution="feet" aria-pressed="false"><span><span class="evolution-name">이동 가속</span><small>이동 속도 1.5배</small></span><strong>미적용</strong></button>
          <button class="help-button" type="button" aria-label="이동 가속 설명" data-help="이동 속도가 초당 1칸에서 1.5칸으로 빨라집니다.&#10;발이 커지고 낮게 흔들리는 걸음으로 이동합니다.&#10;다음에 태어나는 개체부터 적용되며, 기존 개체는 변하지 않습니다.">?</button>
        </div>
      </div>
      </section>

  <div class="help-tooltip" id="help-tooltip" role="tooltip" hidden></div>

  <script>
    const canvas = document.getElementById("world");
    const ctx = canvas.getContext("2d");
    const controlsGuide = document.getElementById("controls-guide");
    const controlsGuideToggle = document.getElementById("controls-guide-toggle");
    const controlsGuideClose = document.getElementById("controls-guide-close");

    let helpTooltipTarget = null;

    function hideHelpTooltip() {
      if (helpTooltipTarget) helpTooltipTarget.removeAttribute("aria-describedby");
      helpTooltipTarget = null;
      helpTooltip.hidden = true;
    }

    function positionHelpTooltip() {
      if (!helpTooltipTarget) return;
      const rect = helpTooltipTarget.getBoundingClientRect();
      const panel = helpTooltipTarget.closest(".colony-menu, .evolution-panel");
      const panelRect = panel.getBoundingClientRect();
      if (!helpTooltipTarget.getClientRects().length || rect.bottom <= panelRect.top || rect.top >= panelRect.bottom) {
        hideHelpTooltip();
        return;
      }
      const width = helpTooltip.offsetWidth;
      const left = rect.right + 8 + width <= window.innerWidth - 10 ? rect.right + 8 : rect.left - width - 8;
      helpTooltip.style.left = clamp(left, 10, Math.max(10, window.innerWidth - width - 10)) + "px";
      helpTooltip.style.top = clamp(rect.top, 10, Math.max(10, window.innerHeight - helpTooltip.offsetHeight - 10)) + "px";
    }

    function showHelpTooltip(button) {
      hideHelpTooltip();
      helpTooltipTarget = button;
      helpTooltip.textContent = button.dataset.help;
      helpTooltip.hidden = false;
      button.setAttribute("aria-describedby", "help-tooltip");
      positionHelpTooltip();
    }

    document.querySelectorAll("[data-help]").forEach((button) => {
      button.addEventListener("pointerenter", () => showHelpTooltip(button));
      button.addEventListener("pointerleave", () => {
        if (document.activeElement !== button) hideHelpTooltip();
      });
      button.addEventListener("focus", () => showHelpTooltip(button));
      button.addEventListener("blur", hideHelpTooltip);
      button.addEventListener("click", () => showHelpTooltip(button));
    });
    document.addEventListener("pointerdown", (event) => {

    }

    function colonyBoundaryCells() {
      const cells = [];
      const seen = new Set();
      for (const entry of colonyEntries) {
        for (const key of entry.occupiedCells) {
          const [localX, localY] = key.split(",").map(Number);
          const x = entry.x + localX;
          const y = entry.y + localY;
          for (const cell of walkableNeighbors(x, y)) {
            const boundaryKey = cell.x + "," + cell.y;
            if (!seen.has(boundaryKey)) {
              seen.add(boundaryKey);
              cells.push({ x: cell.x, y: cell.y });
            }
          }
        }
      }
      return cells;
    }

      for (const cell of colonyBoundaryCells()) {
        const distance = Math.abs(x - cell.x) + Math.abs(y - cell.y);
        if (distance < nearestDistance) {
          nearest = cell;
          nearestDistance = distance;
        }

    function clamp(value, min, max) {

    function smoothstep(value) {
      return value * value * (3 - 2 * value);
    }

    function hashNoise(x, y) {
      let value = Math.imul(x, 374761393) + Math.imul(y, 668265263);
      value = Math.imul(value ^ (value >>> 13), 1274126177);
      return ((value ^ (value >>> 16)) >>> 0) / 4294967295;
    }

    function valueNoise(x, y, scale) {
      const gridX = Math.floor(x / scale);
      const gridY = Math.floor(y / scale);
      const localX = smoothstep((x / scale) - gridX);
      const localY = smoothstep((y / scale) - gridY);
      const top = hashNoise(gridX, gridY) * (1 - localX) +
        hashNoise(gridX + 1, gridY) * localX;
      const bottom = hashNoise(gridX, gridY + 1) * (1 - localX) +
        hashNoise(gridX + 1, gridY + 1) * localX;
      return top * (1 - localY) + bottom * localY;
    }

      const isStarterGround = dx <= 4 && dy <= 3 && dx + dy <= 6;
