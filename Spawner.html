<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spawner</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101315;
      --panel: #171d20;
      --panel-2: #20282b;
      --ink: #e4e9ea;
      --muted: #9aa7aa;
      --line: #314044;
      --accent: #75c4b6;
      --amber: #d6b26b;
      --danger: #c06b62;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: Arial, "Malgun Gothic", sans-serif;
      overflow: hidden;
    }

    .app {
      display: grid;
      grid-template-rows: 1fr;
      min-height: 100vh;
    }

    .stage {
      position: relative;
      display: grid;
      place-items: center;
      min-height: 0;
      background:
        radial-gradient(circle at 50% 50%, rgba(117, 196, 182, 0.08), transparent 36%),
        linear-gradient(180deg, #111719, #0d1012);
    }

    canvas {
      width: 100vw;
      height: 100vh;
      border: 0;
      background: #111619;
      image-rendering: crisp-edges;
      outline: none;
    }

    .colony-action-bar {
      position: fixed;
      left: 50%;
      bottom: 16px;
      z-index: 3;
      display: flex;
      gap: 8px;
      transform: translateX(-50%);
    }
    .colony-focus-button {
      min-width: 88px;
      height: 32px;
      padding: 0 14px;
      border: 1px solid #75c4b65c;
      border-radius: 999px;
      background: rgba(18, 25, 27, 0.88);
      color: #c8d7d5;
      font-size: 0.76rem;
      cursor: pointer;
      box-shadow: 0 6px 18px #0006;
    }
    .colony-focus-button:hover { border-color: #75c4b6a8; background: #1b2d2d; color: #ecf5f3; }
    .colony-focus-button:focus-visible { outline: 2px solid #75c4b6; outline-offset: 2px; }
    .agent-panel {
      position: fixed; top: 16px; left: 16px; z-index: 4;
      width: min(280px, calc(100vw - 32px)); max-height: 82vh;
      padding: 12px; overflow: hidden; border: 1px solid #ffffff1f;
      border-radius: 9px; background: rgba(18, 25, 27, 0.9);
      box-shadow: 0 12px 36px #0007;
    }
    .agent-panel h2 { margin: 0 0 8px; font-size: 0.9rem; }
    .agent-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 7px; max-height: 42vh; overflow: auto; }
    .agent-item { display: grid; justify-items: center; gap: 3px; min-width: 0; min-height: 98px; padding: 7px 5px; border: 1px solid #314044; border-radius: 8px; background: #ffffff08; color: #e4e9ea; text-align: center; cursor: pointer; }
    .agent-item:hover { border-color: #75c4b688; background: #75c4b612; }
    .agent-item img { width: 52px; height: 52px; object-fit: contain; image-rendering: pixelated; }
    .agent-item span { max-width: 100%; overflow: hidden; color: #dce4e2; font-size: 0.72rem; text-overflow: ellipsis; white-space: nowrap; }
    .agent-item small { color: #9aa7aa; font-size: 0.66rem; }
    .agent-item.is-selected { border-color: #d6b26baa; background: #d6b26b16; box-shadow: inset 0 0 0 1px #d6b26b44; }
    .agent-detail { margin-top: 9px; padding-top: 9px; border-top: 1px solid #314044; color: #9aa7aa; font-size: 0.76rem; }
    .agent-detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px 10px; margin-top: 7px; }
    .agent-detail-grid span { display: flex; justify-content: space-between; gap: 6px; }
    .agent-detail-grid strong { color: #e4e9ea; font-weight: 500; }
    .colony-panel {
      position: fixed;
      top: 18px;
      right: 18px;
      z-index: 4;
      width: min(330px, calc(100vw - 36px));
      max-height: calc(100vh - 36px);
      overflow: auto;
      padding: 16px;
      border: 1px solid #ffffff1f;
      border-radius: 10px;
      background: rgba(18, 25, 27, 0.94);
      box-shadow: 0 18px 52px #0009;
      opacity: 0;
      pointer-events: none;
      transform: translateX(18px);
      transition: opacity 140ms ease, transform 140ms ease;
    }

    .colony-panel.is-open {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(0);
    }

    .panel-header,
    .colony-stats,
    .factor-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .panel-header h2 {
      margin: 0;
      font-size: 1rem;
    }

    .panel-close {
      width: 28px;
      height: 28px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #ffffff0a;
      color: var(--ink);
      cursor: pointer;
    }

    .panel-note {
      margin: 7px 0 13px;
      color: var(--muted);
      font-size: 0.8rem;
    }

    .colony-stats {
      margin-bottom: 14px;
      padding: 9px 10px;
      border: 1px solid var(--line);
      border-radius: 7px;
      color: var(--accent);
      font-size: 0.82rem;
    }


    .food-progress-stat {
      flex: 1;
      font-variant-numeric: tabular-nums;
    }
    .evolution-stat {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 2px 0 12px;
      padding: 8px 10px;
      border: 1px solid #75c4b63d;
      border-radius: 7px;
      background: #75c4b60a;
      color: var(--muted);
      font-size: 0.82rem;
    }
    .evolution-stat strong { color: var(--accent); font-variant-numeric: tabular-nums; }

    .food-progress-track {
      width: 100%;
      height: 6px;
      margin: -7px 0 14px;
      overflow: hidden;
      border-radius: 999px;
      background: #0d1214;
      box-shadow: inset 0 0 0 1px #ffffff12;
    }

    .food-progress-fill {
      display: block;
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #8b754c, var(--amber));
      transition: width 160ms ease;
    }
    .factor-list {
      display: grid;
      gap: 11px;
    }

    .factor {
      display: grid;
      gap: 5px;
    }

    .factor-label {
      color: var(--muted);
      font-size: 0.82rem;
    }

    .factor-label output {
      color: var(--ink);
      font-variant-numeric: tabular-nums;
    }
    .factor-name { display: inline-flex; align-items: center; gap: 5px; }
    .factor-help {
      position: relative;
      display: inline-grid;
      place-items: center;
      width: 16px;
      height: 16px;
      padding: 0;
      border: 1px solid #75c4b67a;
      border-radius: 50%;
      background: transparent;
      color: var(--accent);
      font-size: 0.65rem;
      line-height: 1;
      cursor: help;
    }
    .factor-help::after {
      position: absolute;
      top: calc(100% + 7px);
      left: -5px;
      z-index: 8;
      width: 218px;
      padding: 8px 10px;
      border: 1px solid #75c4b64a;
      border-radius: 7px;
      background: #101719f5;
      box-shadow: 0 8px 24px #0009;
      color: #d7e0df;
      content: attr(data-tooltip);
      font-size: 0.72rem;
      font-weight: 400;
      line-height: 1.45;
      opacity: 0;
      pointer-events: none;
      text-align: left;
      transform: translateY(-3px);
      transition: opacity 100ms ease, transform 100ms ease;
    }
    .factor-help:hover::after,
    .factor-help:focus-visible::after { opacity: 1; transform: translateY(0); }
    .factor-help:focus-visible { outline: 1px solid var(--accent); outline-offset: 2px; }

    .factor-controls { display: grid; grid-template-columns: 40px 40px; justify-content: end; gap: 6px; align-items: center; }
    .factor-controls input[hidden] { display: none; }
    .factor-controls button { height: 34px; border: 1px solid var(--line); border-radius: 6px; background: #ffffff0a; color: var(--ink); font-size: 1.05rem; cursor: pointer; }
    .factor-controls button:disabled { opacity: 0.28; cursor: default; }
    .factor input {
      width: 100%;
      accent-color: var(--accent);
    }
  </style>
</head>
<body>
  <div class="app">
    <main class="stage">
      <canvas id="world" width="1200" height="760" tabindex="0" aria-label="Spawner world canvas"></canvas>
    </main>
<div class="colony-action-bar" aria-label="군락 바로가기">
      <button class="colony-focus-button" id="colony-focus-button" type="button">군락 보기</button>
      <button class="colony-focus-button" id="colony-open-button" type="button">군락 열기</button>
    </div>
    <aside class="agent-panel" aria-label="생명체 목록">
      <h2>생명체 <span id="agent-list-count">1</span></h2>
      <div class="agent-list" id="agent-list"></div>
      <section class="agent-detail" id="agent-detail">개체를 선택하면 DNA를 표시합니다.</section>
    </aside>
    <aside class="colony-panel" id="colony-panel" aria-hidden="true">
      <div class="panel-header">
        <h2>다음 세대 탐색 설정</h2>
        <button class="panel-close" id="panel-close" type="button" aria-label="닫기">×</button>
      </div>
      <div class="colony-stats">
        <span class="food-progress-stat">먹이 <strong id="stored-food">0</strong> / <strong id="birth-cost">5</strong></span>
        <span>개체 <strong id="agent-count">1</strong></span>
      </div>
      <div class="food-progress-track" aria-label="다음 생명체 탄생 먹이 진행도">
        <i class="food-progress-fill" id="food-progress-fill"></i>
      </div>
      <p class="panel-note">아래 수치는 다음 탄생부터 적용됩니다.</p>
      <div class="evolution-stat">
        <span>진화 포인트</span>
        <strong><span id="evolution-points">0</span>점</strong>
      </div>
      <div class="factor-list">
        <div class="factor"><span class="factor-label"><span class="factor-name">발걸음<button class="factor-help" type="button" aria-label="발걸음 설명" data-tooltip="높을수록 한 칸을 더 빨리 이동해 탐색과 운반 주기가 짧아집니다.">?</button></span><output data-output="speed">1.0칸/초</output></span><div class="factor-controls"><button type="button" data-profile-adjust="speed" data-direction="-1">−</button><input data-profile="speed" type="range" min="0.5" max="3" step="0.25" value="1" hidden><button type="button" data-profile-adjust="speed" data-direction="1">+</button></div></div>
        <div class="factor"><span class="factor-label"><span class="factor-name">운반력<button class="factor-help" type="button" aria-label="운반력 설명" data-tooltip="먹이를 발견했을 때 한 번에 군락으로 가져오는 양입니다.">?</button></span><output data-output="capacity">1</output></span><div class="factor-controls"><button type="button" data-profile-adjust="capacity" data-direction="-1">−</button><input data-profile="capacity" type="range" min="1" max="5" step="1" value="1" hidden><button type="button" data-profile-adjust="capacity" data-direction="1">+</button></div></div>
        <div class="factor"><span class="factor-label"><span class="factor-name">시야<button class="factor-help" type="button" aria-label="시야 설명" data-tooltip="주변 먹이의 정확한 위치를 알아차릴 수 있는 반경입니다.">?</button></span><output data-output="vision">1칸</output></span><div class="factor-controls"><button type="button" data-profile-adjust="vision" data-direction="-1">−</button><input data-profile="vision" type="range" min="1" max="8" step="1" value="1" hidden><button type="button" data-profile-adjust="vision" data-direction="1">+</button></div></div>
        <div class="factor"><span class="factor-label"><span class="factor-name">직진성<button class="factor-help" type="button" aria-label="직진성 설명" data-tooltip="높을수록 현재 방향을 유지합니다. 오래 직진하면 방향 피로로 확률이 낮아집니다.">?</button></span><output data-output="direction">65%</output></span><div class="factor-controls"><button type="button" data-profile-adjust="direction" data-direction="-1">−</button><input data-profile="direction" type="range" min="0.05" max="0.95" step="0.1" value="0.65" hidden><button type="button" data-profile-adjust="direction" data-direction="1">+</button></div></div>
        <div class="factor"><span class="factor-label"><span class="factor-name">개척성<button class="factor-help" type="button" aria-label="개척성 설명" data-tooltip="높을수록 이미 지나간 길보다 아직 방문하지 않은 칸을 우선합니다.">?</button></span><output data-output="novelty">70%</output></span><div class="factor-controls"><button type="button" data-profile-adjust="novelty" data-direction="-1">−</button><input data-profile="novelty" type="range" min="0" max="1" step="0.1" value="0.7" hidden><button type="button" data-profile-adjust="novelty" data-direction="1">+</button></div></div>
        <div class="factor"><span class="factor-label"><span class="factor-name">풍요 선호<button class="factor-help" type="button" aria-label="풍요 선호 설명" data-tooltip="높을수록 가까운 먹이보다 많이 남은 먹이를 우선합니다.">?</button></span><output data-output="richness">45%</output></span><div class="factor-controls"><button type="button" data-profile-adjust="richness" data-direction="-1">−</button><input data-profile="richness" type="range" min="0.05" max="0.95" step="0.1" value="0.45" hidden><button type="button" data-profile-adjust="richness" data-direction="1">+</button></div></div>
        <div class="factor"><span class="factor-label"><span class="factor-name">기억력<button class="factor-help" type="button" aria-label="기억력 설명" data-tooltip="발견한 먹이 위치와 왕복 경로를 기억해 다시 이용하는 횟수입니다.">?</button></span><output data-output="memoryTrips">8회</output></span><div class="factor-controls"><button type="button" data-profile-adjust="memoryTrips" data-direction="-1">−</button><input data-profile="memoryTrips" type="range" min="2" max="20" step="2" value="8" hidden><button type="button" data-profile-adjust="memoryTrips" data-direction="1">+</button></div></div>
        <div class="factor"><span class="factor-label"><span class="factor-name">길눈<button class="factor-help" type="button" aria-label="길눈 설명" data-tooltip="이미 확인한 칸 안에서 기존 왕복길보다 짧은 경로를 찾아내는 능력입니다.">?</button></span><output data-output="routeSense">55%</output></span><div class="factor-controls"><button type="button" data-profile-adjust="routeSense" data-direction="-1">−</button><input data-profile="routeSense" type="range" min="0.05" max="0.95" step="0.1" value="0.55" hidden><button type="button" data-profile-adjust="routeSense" data-direction="1">+</button></div></div>
      </div>
    </aside>
  </div>

    const ctx = canvas.getContext("2d");
    const colonyFocusButton = document.getElementById("colony-focus-button");

    const WORLD_SIZE = 10000;

    function isColonyBoundaryCell(x, y) {
      const localX = x - COLONY_ORIGIN.x;
      const localY = y - COLONY_ORIGIN.y;
      const besideHorizontalEdge =
        localX >= 0 && localX < COLONY_SIZE &&
        (localY === -1 || localY === COLONY_SIZE);
      const besideVerticalEdge =
        localY >= 0 && localY < COLONY_SIZE &&
        (localX === -1 || localX === COLONY_SIZE);
      return besideHorizontalEdge || besideVerticalEdge;
    }

    function colonyBoundaryCells() {
      const cells = [];
      for (let localY = -1; localY <= COLONY_SIZE; localY += 1) {
        for (let localX = -1; localX <= COLONY_SIZE; localX += 1) {
          const x = COLONY_ORIGIN.x + localX;
          const y = COLONY_ORIGIN.y + localY;
          if (isColonyBoundaryCell(x, y)) {
            cells.push({ x, y });
          }
        }
      }
      return cells;
    }

    function nearestColonyBoundaryCell(x, y) {
      let nearest = null;
      let nearestDistance = Infinity;
      for (const cell of colonyBoundaryCells()) {
        const distance = Math.abs(x - cell.x) + Math.abs(y - cell.y);
        if (distance < nearestDistance) {
          nearest = cell;
          nearestDistance = distance;
        }
      }
      return nearest;
    }

    function chooseSpawnPosition() {

      for (let offset = 0; offset < cells.length; offset += 1) {

        const occupancy = state.agents.reduce(
          (count, agent) => count +
            (agent.x === cell.x && agent.y === cell.y ? 1 : 0),
          0
        );
        if (occupancy < bestOccupancy) {
          best = cell;
          bestOccupancy = occupancy;
        }
      }
      return { ...best };

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function smoothstep(value) {
      return value * value * (3 - 2 * value);
    }

    function hashNoise(x, y) {
      let value = Math.imul(x, 374761393) + Math.imul(y, 668265263);
      value = Math.imul(value ^ (value >>> 13), 1274126177);
      return ((value ^ (value >>> 16)) >>> 0) / 4294967295;
    }

    function valueNoise(x, y, scale) {
      const gridX = Math.floor(x / scale);
      const gridY = Math.floor(y / scale);
      const localX = smoothstep((x / scale) - gridX);
      const localY = smoothstep((y / scale) - gridY);
      const top = hashNoise(gridX, gridY) * (1 - localX) +
        hashNoise(gridX + 1, gridY) * localX;
      const bottom = hashNoise(gridX, gridY + 1) * (1 - localX) +
        hashNoise(gridX + 1, gridY + 1) * localX;
      return top * (1 - localY) + bottom * localY;
    }

    function landSignal(x, y) {
      const broad = valueNoise(x, y, 180);
      const regional = valueNoise(x + 1703, y - 811, 72);
      const edgeDetail = valueNoise(x - 419, y + 2381, 24);
      const dx = x + 0.5 - COLONY_CENTER.x;
      const dy = y + 0.5 - COLONY_CENTER.y;
      const spawnDistance = Math.hypot(dx / 10, dy / 7);
      const spawnLand = clamp(1 - spawnDistance, 0, 1) * 0.72;
      return broad * 0.58 + regional * 0.3 + edgeDetail * 0.12 + spawnLand;
    }

    function isLandCell(x, y) {
      if (x < 0 || y < 0 || x >= WORLD_SIZE || y >= WORLD_SIZE) {
        return false;

      const key = x + "," + y;
      if (landCache.has(key)) {
        return landCache.get(key);

      const dx = Math.abs(x + 0.5 - COLONY_CENTER.x);
      const dy = Math.abs(y + 0.5 - COLONY_CENTER.y);
      const isStarterGround = dx <= 4 && dy <= 3 && dx + dy <= 6;
      const isLand = isStarterGround || landSignal(x, y) >= 0.52;
      landCache.set(key, isLand);
      return isLand;

    function vegetationTerrainAt(x, y) {
      const dx = x + 0.5 - COLONY_CENTER.x;
      const dy = y + 0.5 - COLONY_CENTER.y;
      if (Math.hypot(dx, dy) < 10) {
        return "land";

        valueNoise(x + 4201, y - 1709, 140) * 0.65 +

      const forestCluster =
        valueNoise(x - 5119, y + 2801, 190) * 0.6 +
        valueNoise(x + 733, y - 3917, 64) * 0.4;

      if (fertility >= 0.5 && forestCluster >= 0.61) {
        return "forest";
      }
      if (fertility >= 0.49) {
        return "grassland";
      }
      return "land";

      const dy = y + 0.5 - COLONY_CENTER.y;
      if (Math.hypot(dx, dy) < 18 || landSignal(x, y) < 0.56) {

            isLandCell(x + offset, y + radius) ||
            isLandCell(x - radius, y + offset) ||
            isLandCell(x + radius, y + offset)

            return radius;

      return maxDistance + 1;

        );
      const terrain = terrainAt(centerX, centerY);

      if (terrain !== "land" && terrain !== "grassland") {
        foodSpotCache.set(key, []);
        return [];
      }

      const spawnChance = terrain === "grassland" ? 0.64 : 0.24;
      if (
        !isStarterRegion &&
        hashNoise(regionX + 7013, regionY - 2017) >= spawnChance
      ) {
        foodSpotCache.set(key, []);
        return [];
      }

      const sizeNoise = hashNoise(regionX - 1871, regionY + 4513);
      const targetSize = isStarterRegion ? 3 : terrain === "grassland" ?
        5 + Math.floor(sizeNoise * 8) :
        1 + Math.floor(sizeNoise * 3);
      const cells = [{ x: centerX, y: centerY }];
      const occupied = new Set([centerX + "," + centerY]);
      const frontier = [];

      function addFrontier(x, y) {
        const frontierKey = x + "," + y;
        if (
          occupied.has(frontierKey) ||
          x < 0 ||
          y < 0 ||
          x >= WORLD_SIZE ||
          y >= WORLD_SIZE ||
          terrainAt(x, y) !== terrain ||
          frontier.some((cell) => cell.key === frontierKey)
        ) {
          return;
        }

        const distance = Math.hypot(x - centerX, y - centerY);
        frontier.push({
          x,
          y,
          key: frontierKey,
          score: hashNoise(x * 31 + regionX, y * 17 + regionY) -
            distance * 0.08
        });
      }

      addFrontier(centerX + 1, centerY);
      addFrontier(centerX - 1, centerY);
      addFrontier(centerX, centerY + 1);
      addFrontier(centerX, centerY - 1);

      while (cells.length < targetSize && frontier.length > 0) {
        let bestIndex = 0;
        for (let index = 1; index < frontier.length; index += 1) {
          if (frontier[index].score > frontier[bestIndex].score) {
            bestIndex = index;
          }
        }

        const next = frontier.splice(bestIndex, 1)[0];
        occupied.add(next.key);
        cells.push({ x: next.x, y: next.y });
        addFrontier(next.x + 1, next.y);
        addFrontier(next.x - 1, next.y);
        addFrontier(next.x, next.y + 1);
        addFrontier(next.x, next.y - 1);
      }

      for (const foodCell of cells) {
        foodCell.amount = FOOD_PER_CELL;
        foodCellMap.set(foodCell.x + "," + foodCell.y, foodCell);
      }

      const spot = { terrain, cells };
      foodSpotCache.set(key, spot);
      return spot;
    }

    function birthCost(population = state.agents.length) {
      const livingPopulation = Math.max(1, population);
      return Math.max(
        5,
        Math.round(5 * Math.pow(livingPopulation, 1.3))
      );
    }

    function ensureFoodAround(x, y, radius) {
      const startRegionX = Math.floor((x - radius) / FOOD_REGION_SIZE);
      const startRegionY = Math.floor((y - radius) / FOOD_REGION_SIZE);
      const endRegionX = Math.floor((x + radius) / FOOD_REGION_SIZE);
      const endRegionY = Math.floor((y + radius) / FOOD_REGION_SIZE);

      for (let regionY = startRegionY; regionY <= endRegionY; regionY += 1) {
        for (let regionX = startRegionX; regionX <= endRegionX; regionX += 1) {
          foodSpotForRegion(regionX, regionY);
        }
      }
    }

    function foodCellAt(x, y) {
      ensureFoodAround(x, y, 1);
      return foodCellMap.get(x + "," + y) || null;
    }

    function isWalkable(x, y) {
      if (x < 0 || y < 0 || x >= WORLD_SIZE || y >= WORLD_SIZE) {
        return false;
      }
      const terrain = terrainAt(x, y);
      return terrain === "land" ||
        terrain === "grassland" ||
        terrain === "forest" ||
        terrain === "lowMountain";
    }

    function spawnAgent(grantEvolutionPoint = true) {
      const position = chooseSpawnPosition();
      const agent = {
        id: state.nextAgentId,
        x: position.x,
        y: position.y,
        profile: { ...state.draftProfile },
        bornAt: state.simSeconds,
        carrying: 0,
        moveBudget: 0,
        mode: "search",
        targetFoodKey: null,
        rememberedFoodKey: null,
        sharedTrailFoodKey: null,
        rememberedRoute: null,
        memoryTripsRemaining: 0,
        routeIndex: 0,
        path: [{ ...position }],
        visited: new Set([position.x + "," + position.y]),
        lastDirection: null,
        straightSteps: 0,
        stepCount: 0,
        renderFromX: position.x,
        renderFromY: position.y,
        moveStartedAt: state.simSeconds,
        moveDuration: 0
      };
      state.nextAgentId += 1;
      state.agents.push(agent);
      if (grantEvolutionPoint) {
        state.evolutionPoints += 1;
      }
      return agent;
    }

    function visibleFoodFor(agent) {
      const radius = agent.profile.vision;
      ensureFoodAround(agent.x, agent.y, radius);
      let best = null;
      let bestScore = -Infinity;

      for (let offsetY = -radius; offsetY <= radius; offsetY += 1) {
        for (let offsetX = -radius; offsetX <= radius; offsetX += 1) {
          const distance = Math.hypot(offsetX, offsetY);
          if (distance > radius) {
            continue;
          }
          const x = agent.x + offsetX;
          const y = agent.y + offsetY;
          const foodCell = foodCellMap.get(x + "," + y);
          if (!foodCell || foodCell.amount <= 0) {
            continue;
          }
          const richness = foodCell.amount / FOOD_PER_CELL;
          const score =
            -distance * (1 - agent.profile.richness) +
            richness * radius * agent.profile.richness;
          if (score > bestScore) {
            best = foodCell;
            bestScore = score;
          }
        }
      }
      return best;
    }

    function walkableNeighbors(x, y) {
      return [
        { x: x + 1, y, dx: 1, dy: 0 },
        { x: x - 1, y, dx: -1, dy: 0 },
        { x, y: y + 1, dx: 0, dy: 1 },
        { x, y: y - 1, dx: 0, dy: -1 }
      ].filter((cell) => isWalkable(cell.x, cell.y));
    }

    function moveAgent(agent, destination, rememberPath = true) {
      const nextDirection = {
        dx: destination.x - agent.x,
        dy: destination.y - agent.y
      };
      const keptDirection = agent.lastDirection &&
        agent.lastDirection.dx === nextDirection.dx &&
        agent.lastDirection.dy === nextDirection.dy;
      agent.straightSteps = keptDirection ? agent.straightSteps + 1 : 1;
      agent.lastDirection = nextDirection;
      const rendered = interpolatedAgentPosition(agent);
      agent.renderFromX = rendered.x;
      agent.renderFromY = rendered.y;
      agent.moveStartedAt = state.simSeconds;
      agent.moveDuration = 1 / Math.max(0.01, agent.profile.speed);
      agent.x = destination.x;
      agent.y = destination.y;
      agent.stepCount += 1;
      agent.visited.add(agent.x + "," + agent.y);
      if (rememberPath) {
        agent.path.push({ x: agent.x, y: agent.y });
      }
    }

    function foodScentAt(x, y) {
      ensureFoodAround(x, y, FOOD_SCENT_RADIUS);
      let strength = 0;

      for (let offsetY = -FOOD_SCENT_RADIUS; offsetY <= FOOD_SCENT_RADIUS; offsetY += 1) {
        for (let offsetX = -FOOD_SCENT_RADIUS; offsetX <= FOOD_SCENT_RADIUS; offsetX += 1) {
          const distance = Math.hypot(offsetX, offsetY);
          if (distance > FOOD_SCENT_RADIUS) {
            continue;
          }
          const foodCell = foodCellMap.get((x + offsetX) + "," + (y + offsetY));
          if (!foodCell || foodCell.amount <= 0) {
            continue;
          }
          const remainingRatio = foodCell.amount / FOOD_PER_CELL;
          const falloff = 1 - distance / (FOOD_SCENT_RADIUS + 1);
          strength += remainingRatio * falloff * falloff;
        }
      }
      return strength;
    }

    function scentGuidedStep(agent, neighbors) {
      const currentStrength = foodScentAt(agent.x, agent.y);
      let best = null;
      let bestStrength = currentStrength + 0.01;

      for (const neighbor of neighbors) {
        const strength = foodScentAt(neighbor.x, neighbor.y);
        const tieBreak = hashNoise(
          neighbor.x + agent.id * 307,
          neighbor.y + agent.stepCount * 43
        ) * 0.002;
        if (strength + tieBreak > bestStrength) {
          best = neighbor;
          bestStrength = strength + tieBreak;
        }
      }

      if (!best) {
        return null;
      }
      const guidanceRoll = hashNoise(
        agent.id * 719 + agent.stepCount,
        agent.x * 23 + agent.y * 47
      );
      return guidanceRoll < FOOD_SCENT_GUIDANCE_CHANCE ? best : null;
    }
    function registerSharedTrail(route, foodKey, strengthGain = 1) {
      if (!route || route.length < 2 || !foodKey) {
        return;
      }

      for (let index = 0; index < route.length - 1; index += 1) {
        const from = route[index];
        const to = route[index + 1];
        const cellKey = from.x + "," + from.y;
        let entries = state.sharedTrails.get(cellKey);
        if (!entries) {
          entries = [];
          state.sharedTrails.set(cellKey, entries);
        }
        let entry = entries.find(
          (candidate) =>
            candidate.foodKey === foodKey &&
            candidate.nextX === to.x &&
            candidate.nextY === to.y
        );
        if (!entry) {
          entry = {
            fromX: from.x,
            fromY: from.y,
            nextX: to.x,
            nextY: to.y,
            foodKey,
            strength: 0
          };
          entries.push(entry);
        }
        entry.strength += strengthGain;
      }
    }

    function rebuildSharedTrailIndex(road) {
      for (const [cellKey, entries] of state.sharedTrails) {
        const remaining = entries.filter(
          (entry) => entry.foodKey !== road.foodKey
        );
        if (remaining.length > 0) {
          state.sharedTrails.set(cellKey, remaining);
        } else {
          state.sharedTrails.delete(cellKey);
        }
      }
      registerSharedTrail(road.route, road.foodKey, road.usageCount);
    }

    function registerRoadJourney(agent) {
      const route = agent.rememberedRoute;
      const foodKey = agent.rememberedFoodKey;
      if (!route || route.length < 2 || !foodKey) {
        return;
      }

      let road = state.roads.get(foodKey);
      if (!road) {
        road = {
          id: "road-" + foodKey,
          foodKey,
          route: route.map((cell) => ({ ...cell })),
          usageCount: 0,
          optimizationCount: 0,
          knownCells: new Set()
        };
        state.roads.set(foodKey, road);
      }
      road.usageCount += 1;
      for (const cellKey of agent.visited) {
        road.knownCells.add(cellKey);
      }
      for (const cell of route) {
        road.knownCells.add(cell.x + "," + cell.y);
      }
      if (route.length < road.route.length) {
        road.route = route.map((cell) => ({ ...cell }));
      }

      const goal = road.route[road.route.length - 1];
      const collectiveScale = 1 + Math.log2(road.usageCount + 1) * 5;
      const expansionBudget = Math.max(
        road.route.length,
        Math.floor(road.route.length * collectiveScale)
      );
      const optimized = bestKnownColonyRoute(
        { visited: road.knownCells },
        goal,
        expansionBudget,
        road.route
      );
      if (optimized && optimized.length < road.route.length) {
        road.route = optimized;
        road.optimizationCount += 1;
      }
      rebuildSharedTrailIndex(road);
    }
    function sharedTrailStep(agent, neighbors) {
      const entries = state.sharedTrails.get(agent.x + "," + agent.y) || [];
      let best = null;
      let bestScore = -Infinity;

      for (const entry of entries) {
        if (
          agent.sharedTrailFoodKey &&
          entry.foodKey !== agent.sharedTrailFoodKey
        ) {
          continue;
        }
        const foodCell = foodCellMap.get(entry.foodKey);
        if (!foodCell || foodCell.amount <= 0) {
          continue;
        }
        const neighbor = neighbors.find(
          (candidate) =>
            candidate.x === entry.nextX && candidate.y === entry.nextY
        );
        if (!neighbor) {
          continue;
        }
        const score = Math.log1p(entry.strength) + hashNoise(
          entry.nextX + agent.id * 887,
          entry.nextY + agent.stepCount * 59
        ) * 0.04;
        if (score > bestScore) {
          best = { neighbor, entry };
          bestScore = score;
        }
      }

      if (!best) {
        agent.sharedTrailFoodKey = null;
        return null;
      }
      if (agent.sharedTrailFoodKey) {
        return best.neighbor;
      }
      const followRoll = hashNoise(
        agent.id * 977 + agent.stepCount,
        agent.x * 41 - agent.y * 19
      );
      if (followRoll >= SHARED_TRAIL_FOLLOW_CHANCE) {
        return null;
      }
      agent.sharedTrailFoodKey = best.entry.foodKey;
      return best.neighbor;
    }
    function chooseExplorationStep(agent) {
      const neighbors = walkableNeighbors(agent.x, agent.y);
      if (neighbors.length === 0) {
        return null;
      }

      const trailStep = sharedTrailStep(agent, neighbors);
      if (trailStep) {
        return trailStep;
      }

      const scentedStep = scentGuidedStep(agent, neighbors);
      if (scentedStep) {
        return scentedStep;
      }

      const forward = agent.lastDirection ? neighbors.find(
        (neighbor) =>
          neighbor.dx === agent.lastDirection.dx &&
          neighbor.dy === agent.lastDirection.dy
      ) : null;
      const directionFatigue = clamp(1 - agent.straightSteps / 6, 0.25, 1);
      const directionChance = agent.profile.direction * directionFatigue;
      const directionRoll = hashNoise(
        agent.id * 401 + agent.stepCount,
        agent.x * 17 + agent.y * 29
      );

      if (forward && directionRoll < directionChance) {
        return forward;
      }

      let candidates = forward && neighbors.length > 1 ?
        neighbors.filter((neighbor) => neighbor !== forward) : [...neighbors];
      const unvisited = candidates.filter(
        (neighbor) => !agent.visited.has(neighbor.x + "," + neighbor.y)
      );
      const noveltyRoll = hashNoise(
        agent.id * 613 + agent.stepCount,
        agent.x * 37 - agent.y * 11
      );
      if (unvisited.length > 0 && noveltyRoll < agent.profile.novelty) {
        candidates = unvisited;
      }

      let best = null;
      let bestScore = -Infinity;
      for (const candidate of candidates) {
        const terrain = terrainAt(candidate.x, candidate.y);
        const terrainPenalty = terrain === "lowMountain" ?
          0.28 : terrain === "forest" ? 0.08 : 0;
        const score = hashNoise(
          candidate.x + agent.id * 101,
          candidate.y + agent.stepCount * 53
        ) - terrainPenalty;
        if (score > bestScore) {
          best = candidate;
          bestScore = score;
        }
      }

      return best;
    }
    function chooseStepToward(agent, target) {
      const neighbors = walkableNeighbors(agent.x, agent.y);
      let best = null;
      let bestScore = Infinity;

      for (const neighbor of neighbors) {
        const distance =
          Math.abs(target.x - neighbor.x) + Math.abs(target.y - neighbor.y);
        const jitter = hashNoise(
          neighbor.x + agent.id * 211,
          neighbor.y + agent.stepCount * 97
        ) * 0.16;
        const score = distance + jitter;
        if (score < bestScore) {
          best = neighbor;
          bestScore = score;
        }
      }
      return best;
    }

    function knownPath(agent, start, goal, expansionBudget) {
      const startKey = start.x + "," + start.y;
      const goalKey = goal.x + "," + goal.y;
      const open = [startKey];
      const openSet = new Set(open);
      const cameFrom = new Map();
      const cost = new Map([[startKey, 0]]);
      const coordinates = new Map([[startKey, { ...start }], [goalKey, { ...goal }]]);
      let expansions = 0;

      while (open.length > 0 && expansions < expansionBudget) {
        let bestIndex = 0;
        let bestEstimate = Infinity;
        for (let index = 0; index < open.length; index += 1) {
          const key = open[index];
          const cell = coordinates.get(key);
          const estimate =
            (cost.get(key) || 0) +
            Math.abs(goal.x - cell.x) +
            Math.abs(goal.y - cell.y);
          if (estimate < bestEstimate) {
            bestEstimate = estimate;
            bestIndex = index;
          }
        }

        const currentKey = open.splice(bestIndex, 1)[0];
        openSet.delete(currentKey);
        const current = coordinates.get(currentKey);
        if (currentKey === goalKey) {
          const path = [{ ...goal }];
          let traceKey = goalKey;
          while (cameFrom.has(traceKey)) {
            traceKey = cameFrom.get(traceKey);
            path.push({ ...coordinates.get(traceKey) });
          }
          path.reverse();
          return path;
        }

        expansions += 1;
        for (const neighbor of walkableNeighbors(current.x, current.y)) {
          const neighborKey = neighbor.x + "," + neighbor.y;
          if (
            neighborKey !== goalKey &&
            neighborKey !== startKey &&
            !agent.visited.has(neighborKey)
          ) {
            continue;
          }

          coordinates.set(neighborKey, { x: neighbor.x, y: neighbor.y });
          const nextCost = (cost.get(currentKey) || 0) + 1;
          if (!cost.has(neighborKey) || nextCost < cost.get(neighborKey)) {
            cameFrom.set(neighborKey, currentKey);
            cost.set(neighborKey, nextCost);
            if (!openSet.has(neighborKey)) {
              open.push(neighborKey);
              openSet.add(neighborKey);
            }
          }
        }
      }

      return null;
    }

    function bestKnownColonyRoute(agent, goal, expansionBudget, fallbackRoute) {
      let bestRoute = fallbackRoute;
      for (const accessCell of colonyBoundaryCells()) {
        const candidate = knownPath(agent, accessCell, goal, expansionBudget);
        if (candidate && (!bestRoute || candidate.length < bestRoute.length)) {
          bestRoute = candidate;
        }
      }
      return bestRoute;
    }

    function optimizeRememberedRoute(agent) {
      const route = agent.rememberedRoute;
      if (!route || route.length < 3 || agent.profile.routeSense <= 0) {
        return route;
      }

      const start = route[0];
      const goal = route[route.length - 1];
      const expansionBudget = Math.max(
        route.length,
        Math.floor(route.length * (1 + agent.profile.routeSense * 8))
      );
      const optimized = knownPath(agent, start, goal, expansionBudget);
      return optimized && optimized.length < route.length ? optimized : route;
    }

    function forgetFoodRoute(agent) {
      agent.targetFoodKey = null;
      agent.rememberedFoodKey = null;
      agent.sharedTrailFoodKey = null;
      agent.rememberedRoute = null;
      agent.memoryTripsRemaining = 0;
      agent.routeIndex = 0;
      agent.mode = "search";
      agent.path = [{ x: agent.x, y: agent.y }];
    }

    function harvestAtCurrentCell(agent) {
      const foodCell = foodCellAt(agent.x, agent.y);
      if (!foodCell || foodCell.amount <= 0) {
        forgetFoodRoute(agent);
        return;
      }
      const isRememberedTrip =
        agent.mode === "commute" && agent.rememberedRoute;
      const followedRoad = agent.sharedTrailFoodKey === agent.x + "," + agent.y ?
        state.roads.get(agent.sharedTrailFoodKey) : null;
      const amount = Math.min(agent.profile.capacity, foodCell.amount);
      foodCell.amount -= amount;
      agent.carrying = amount;
      agent.sharedTrailFoodKey = null;
      agent.rememberedFoodKey = agent.x + "," + agent.y;

      if (!isRememberedTrip) {
        if (followedRoad && followedRoad.route.length >= 2) {
          agent.rememberedRoute = followedRoad.route.map((cell) => ({ ...cell }));
        } else {
          let boundaryIndex = 0;
          for (let index = agent.path.length - 1; index >= 0; index -= 1) {
            const cell = agent.path[index];
            if (isColonyBoundaryCell(cell.x, cell.y)) {
              boundaryIndex = index;
              break;
            }
          }
          agent.rememberedRoute = agent.path
            .slice(boundaryIndex)
            .map((cell) => ({ ...cell }));
        }
        agent.memoryTripsRemaining = agent.profile.memoryTrips;
      }

      agent.mode = "return";
      agent.routeIndex = agent.rememberedRoute.length - 2;
    }

    function depositFood(agent) {
      if (agent.rememberedRoute) {
        const arrivalIndex = agent.rememberedRoute.findIndex(
          (cell) => cell.x === agent.x && cell.y === agent.y
        );
        if (arrivalIndex > 0) {
          agent.rememberedRoute = agent.rememberedRoute.slice(arrivalIndex);
        }
      }

      state.colonyFood += agent.carrying;
      agent.carrying = 0;
      registerRoadJourney(agent);

      while (state.colonyFood >= birthCost()) {
        state.colonyFood -= birthCost();
        spawnAgent();
      }

      const rememberedFood = agent.rememberedFoodKey ?
        foodCellMap.get(agent.rememberedFoodKey) : null;
      if (
        rememberedFood &&
        rememberedFood.amount > 0 &&
        agent.rememberedRoute &&
        agent.memoryTripsRemaining > 0
      ) {
        agent.rememberedRoute = optimizeRememberedRoute(agent);
        agent.memoryTripsRemaining -= 1;
        agent.mode = "commute";
        agent.routeIndex = 1;
        agent.path = [{ x: agent.x, y: agent.y }];
        return;
      }
      forgetFoodRoute(agent);
    }

    function stepAgent(agent) {
      if (agent.mode === "return") {
        if (isColonyBoundaryCell(agent.x, agent.y)) {
          depositFood(agent);
          return;
        }
        if (agent.rememberedRoute && agent.routeIndex >= 0) {
          const destination = agent.rememberedRoute[agent.routeIndex];
          agent.routeIndex -= 1;
          moveAgent(agent, destination, false);
          return;
        }
        const homeStep = chooseStepToward(
          agent,
          nearestColonyBoundaryCell(agent.x, agent.y)
        );
        if (homeStep) {
          moveAgent(agent, homeStep, false);
        }
        return;
      }

      if (agent.mode === "commute") {
        if (
          agent.rememberedRoute &&
          agent.routeIndex < agent.rememberedRoute.length
        ) {
          const destination = agent.rememberedRoute[agent.routeIndex];
          agent.routeIndex += 1;
          moveAgent(agent, destination);
          return;
        }
        harvestAtCurrentCell(agent);
        return;
      }

      if (agent.mode === "approach") {
        const target = agent.targetFoodKey ?
          foodCellMap.get(agent.targetFoodKey) : null;
        if (!target || target.amount <= 0) {
          forgetFoodRoute(agent);
          return;
        }
        if (agent.x === target.x && agent.y === target.y) {
          harvestAtCurrentCell(agent);
          return;
        }
        const targetStep = chooseStepToward(agent, target);
        if (targetStep) {
          moveAgent(agent, targetStep);
        } else {
          forgetFoodRoute(agent);
        }
        return;
      }

      const visibleFood = visibleFoodFor(agent);
      if (visibleFood) {
        agent.targetFoodKey = visibleFood.x + "," + visibleFood.y;
        agent.mode = "approach";
        return;
      }

      const explorationStep = chooseExplorationStep(agent);
      if (explorationStep) {
        moveAgent(agent, explorationStep);
      }
    }

    function updateAgents(elapsed) {
      state.agents = state.agents.filter(
        (agent) => state.simSeconds - agent.bornAt < STARTER_OBJECT_LIFETIME
      );
      const agentsAtFrameStart = [...state.agents];
      for (const agent of agentsAtFrameStart) {
        agent.moveBudget = Math.min(
          1,
          agent.moveBudget + elapsed * agent.profile.speed
        );
        if (agent.moveBudget >= 1) {
          agent.moveBudget -= 1;
          stepAgent(agent);
        }
      }
    }

    function worldToScreen(x, y) {
      return {
        x: canvas.width / 2 + (x - state.camera.x) * state.camera.zoom,
        y: canvas.height / 2 + (y - state.camera.y) * state.camera.zoom
      };
    }

    function screenToWorld(x, y) {
      return {
        x: state.camera.x + (x - canvas.width / 2) / state.camera.zoom,
        y: state.camera.y + (y - canvas.height / 2) / state.camera.zoom
      };
    }

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = Math.max(1, Math.floor(rect.width * dpr));
      canvas.height = Math.max(1, Math.floor(rect.height * dpr));
      ctx.setTransform(1, 0, 0, 1, 0, 0);
    }

    function drawGrid() {
      const zoom = state.camera.zoom;
      const gridStep = zoom >= 28 ? 1 : zoom >= 14 ? 2 : zoom >= 6 ? 5 : zoom >= 3 ? 10 : 20;
      const topLeft = screenToWorld(0, 0);
      const bottomRight = screenToWorld(canvas.width, canvas.height);
      const startX = Math.floor(topLeft.x / gridStep) * gridStep;
      const startY = Math.floor(topLeft.y / gridStep) * gridStep;

      ctx.lineWidth = 1;
      ctx.strokeStyle = "rgba(82, 103, 108, 0.18)";
      ctx.beginPath();

      for (let x = startX; x <= bottomRight.x; x += gridStep) {
        const screen = worldToScreen(x, 0).x;
        ctx.moveTo(Math.round(screen) + 0.5, 0);
        ctx.lineTo(Math.round(screen) + 0.5, canvas.height);
      }

      for (let y = startY; y <= bottomRight.y; y += gridStep) {
        const screen = worldToScreen(0, y).y;
        ctx.moveTo(0, Math.round(screen) + 0.5);
        ctx.lineTo(canvas.width, Math.round(screen) + 0.5);
      }

      ctx.stroke();
    }

    function drawTerrain() {
      const topLeft = screenToWorld(0, 0);
      const bottomRight = screenToWorld(canvas.width, canvas.height);
      const cell = state.camera.zoom;
      const terrainStep = cell >= 8 ? 1 : cell >= 4 ? 2 : 4;
      const startX = clamp(
        Math.floor(topLeft.x / terrainStep) * terrainStep,
        0,
        WORLD_SIZE - 1
      );
      const startY = clamp(
        Math.floor(topLeft.y / terrainStep) * terrainStep,
        0,
        WORLD_SIZE - 1
      );
      const endX = clamp(Math.ceil(bottomRight.x), 0, WORLD_SIZE - 1);
      const endY = clamp(Math.ceil(bottomRight.y), 0, WORLD_SIZE - 1);

      for (let y = startY; y <= endY; y += terrainStep) {
        for (let x = startX; x <= endX; x += terrainStep) {
          const screen = worldToScreen(x, y);
          const sampleX = clamp(
            x + Math.floor(terrainStep / 2),
            0,
            WORLD_SIZE - 1
          );
          const sampleY = clamp(
            y + Math.floor(terrainStep / 2),
            0,
            WORLD_SIZE - 1
          );
          ctx.fillStyle = TERRAIN_COLORS[terrainAt(sampleX, sampleY)];
          ctx.fillRect(
            Math.floor(screen.x),
            Math.floor(screen.y),
            Math.ceil(cell * terrainStep) + 1,
            Math.ceil(cell * terrainStep) + 1
          );
        }
      }
    }

    function drawSharedTrails() {
      const topLeft = screenToWorld(0, 0);
      const bottomRight = screenToWorld(canvas.width, canvas.height);
      const cell = state.camera.zoom;

      ctx.save();
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      for (const entries of state.sharedTrails.values()) {
        for (const entry of entries) {
          if (
            entry.fromX < topLeft.x - 1 ||
            entry.fromX > bottomRight.x + 1 ||
            entry.fromY < topLeft.y - 1 ||
            entry.fromY > bottomRight.y + 1
          ) {
            continue;
          }
          const foodCell = foodCellMap.get(entry.foodKey);
          const isActive = foodCell && foodCell.amount > 0;
          const from = worldToScreen(entry.fromX + 0.5, entry.fromY + 0.5);
          const to = worldToScreen(entry.nextX + 0.5, entry.nextY + 0.5);
          const alpha = isActive ?
            Math.min(0.58, 0.22 + Math.log1p(entry.strength) * 0.09) : 0.08;
          ctx.strokeStyle = "rgba(151, 124, 79, " + alpha + ")";
          ctx.lineWidth = Math.max(1, Math.min(6, cell * 0.13));
          ctx.beginPath();
          ctx.moveTo(from.x, from.y);
          ctx.lineTo(to.x, to.y);
          ctx.stroke();
        }
      }
      ctx.restore();
    }
    function drawFoodSpots() {
      const topLeft = screenToWorld(0, 0);
      const bottomRight = screenToWorld(canvas.width, canvas.height);
      const startRegionX = Math.floor(topLeft.x / FOOD_REGION_SIZE) - 1;
      const startRegionY = Math.floor(topLeft.y / FOOD_REGION_SIZE) - 1;
      const endRegionX = Math.floor(bottomRight.x / FOOD_REGION_SIZE) + 1;
      const endRegionY = Math.floor(bottomRight.y / FOOD_REGION_SIZE) + 1;
      const cell = state.camera.zoom;
      const inset = cell >= 10 ? cell * 0.2 : cell >= 4 ? 1 : 0;

      for (let regionY = startRegionY; regionY <= endRegionY; regionY += 1) {
        for (let regionX = startRegionX; regionX <= endRegionX; regionX += 1) {
          const spot = foodSpotForRegion(regionX, regionY);
          if (!spot.cells) {
            continue;
          }

          ctx.fillStyle = FOOD_COLORS[spot.terrain];
          for (const foodCell of spot.cells) {
            if (foodCell.amount <= 0) {
              continue;
            }

            const screen = worldToScreen(foodCell.x, foodCell.y);
            const remainingRatio = clamp(foodCell.amount / FOOD_PER_CELL, 0, 1);
            ctx.save();
            ctx.globalAlpha = 0.35 + remainingRatio * 0.65;
            ctx.fillStyle = FOOD_COLORS[spot.terrain];
            ctx.fillRect(
              Math.floor(screen.x + inset),
              Math.floor(screen.y + inset),
              Math.max(1, Math.ceil(cell - inset * 2)),
              Math.max(1, Math.ceil(cell - inset * 2))
            );
            ctx.restore();

            if (cell >= 10) {
              const barInset = Math.max(1, cell * 0.16);
              const barHeight = Math.max(2, cell * 0.07);
              const barWidth = cell - barInset * 2;
              const barY = screen.y + cell - barInset - barHeight;
              ctx.fillStyle = "rgba(17, 24, 23, 0.82)";
              ctx.fillRect(screen.x + barInset, barY, barWidth, barHeight);
              ctx.fillStyle = "rgba(222, 229, 148, 0.88)";
              ctx.fillRect(screen.x + barInset, barY, barWidth * remainingRatio, barHeight);
            }

            if (cell >= 24) {
              ctx.fillStyle = "rgba(242, 240, 210, 0.94)";
              ctx.font = Math.max(10, Math.min(15, cell * 0.3)) + "px Arial, Malgun Gothic, sans-serif";
              ctx.textAlign = "center";
              ctx.textBaseline = "middle";
              ctx.fillText(Math.ceil(foodCell.amount).toString(), screen.x + cell / 2, screen.y + cell * 0.46);
            }
          }
        }
      }
    }

    function drawWorldBounds() {
      const topLeft = worldToScreen(0, 0);
      const bottomRight = worldToScreen(WORLD_SIZE, WORLD_SIZE);

      ctx.lineWidth = 2;
      ctx.strokeStyle = "rgba(117, 196, 182, 0.26)";
      ctx.strokeRect(
        topLeft.x,
        topLeft.y,
        bottomRight.x - topLeft.x,
        bottomRight.y - topLeft.y
      );
    }

    function drawColony(now) {
      const cell = state.camera.zoom;
      const size = COLONY_SIZE * cell;
      const topLeft = worldToScreen(COLONY_ORIGIN.x, COLONY_ORIGIN.y);
      const center = worldToScreen(COLONY_CENTER.x, COLONY_CENTER.y);

      const glowRadius = size * 0.7;
      const glow = ctx.createRadialGradient(
        center.x,
        center.y,
        0,
        center.x,
        center.y,
        glowRadius
      );
      glow.addColorStop(0, "rgba(117, 196, 182, 0.38)");
      glow.addColorStop(0.56, "rgba(117, 196, 182, 0.12)");
      glow.addColorStop(1, "rgba(117, 196, 182, 0)");
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(center.x, center.y, glowRadius, 0, Math.PI * 2);
      ctx.fill();

      ctx.save();
      ctx.beginPath();
      ctx.rect(topLeft.x, topLeft.y, size, size);
      ctx.clip();

      for (let y = 0; y < COLONY_SIZE; y += 1) {
        for (let x = 0; x < COLONY_SIZE; x += 1) {
          const isCorner =
            (x === 0 && y === 0) ||
            (x === COLONY_SIZE - 1 && y === 0) ||
            (x === 0 && y === COLONY_SIZE - 1) ||
            (x === COLONY_SIZE - 1 && y === COLONY_SIZE - 1);

          if (isCorner) {
            continue;
          }

          const isCenter = x === 2 && y === 2;
          const px = topLeft.x + x * cell;
          const py = topLeft.y + y * cell;

          ctx.fillStyle = "rgba(66, 132, 122, 0.58)";

          if (isCenter) {
            const inset = Math.max(2, Math.floor(cell * 0.08));
            const gaugeHeight = Math.max(3, Math.floor(cell * 0.1));
            const gap = Math.max(2, Math.floor(cell * 0.04));
            const contentWidth = cell - inset * 2;
            const gaugeY = py + inset;
            const coreY = gaugeY + gaugeHeight + gap;
            const coreHeight = py + cell - inset - coreY;
            const remaining = Math.max(0, COLONY_LIFETIME - state.simSeconds);
            const remainingRatio = remaining / COLONY_LIFETIME;

            ctx.fillStyle = "rgba(34, 47, 50, 0.72)";
            ctx.fillRect(px + inset, gaugeY, contentWidth, gaugeHeight);
            ctx.fillStyle = "rgba(214, 178, 107, 0.78)";
            ctx.fillRect(px + inset, gaugeY, contentWidth * remainingRatio, gaugeHeight);
            const corePulse = (Math.sin(now / 260) + 1) / 2;
            const coreRed = Math.floor(112 + corePulse * 28);
            const coreGreen = Math.floor(168 + corePulse * 30);
            const coreBlue = Math.floor(156 + corePulse * 26);
            const coreAlpha = 0.48 + corePulse * 0.18;
            ctx.fillStyle = `rgba(${coreRed}, ${coreGreen}, ${coreBlue}, ${coreAlpha})`;
            ctx.fillRect(px + inset, coreY, contentWidth, coreHeight);
            continue;
          }

          ctx.fillRect(px - 0.5, py - 0.5, cell + 1, cell + 1);
        }
      }

      const softCore = ctx.createRadialGradient(
        center.x,
        center.y,
        size * 0.08,
        center.x,
        center.y,
        size * 0.74
      );
      softCore.addColorStop(0, "rgba(180, 218, 197, 0.18)");
      softCore.addColorStop(0.74, "rgba(70, 104, 99, 0.04)");
      softCore.addColorStop(1, "rgba(7, 12, 13, 0.18)");
      ctx.fillStyle = softCore;
      ctx.fillRect(topLeft.x, topLeft.y, size, size);
      ctx.restore();


    }

    function interpolatedAgentPosition(agent) {
      if (!agent.moveDuration) {
        return { x: agent.x, y: agent.y, progress: 1 };
      }
      const rawProgress = clamp(
        (state.simSeconds - agent.moveStartedAt) / agent.moveDuration,
        0,
        1
      );
      const smoothProgress = rawProgress * rawProgress * (3 - 2 * rawProgress);
      return {
        x: agent.renderFromX + (agent.x - agent.renderFromX) * smoothProgress,
        y: agent.renderFromY + (agent.y - agent.renderFromY) * smoothProgress,
        progress: rawProgress
      };
    }

    function drawAgents(now) {
      const cell = state.camera.zoom;

      for (const agent of state.agents) {
        const renderPosition = interpolatedAgentPosition(agent);
        const topLeft = worldToScreen(renderPosition.x, renderPosition.y);
        const centerX = topLeft.x + cell / 2;
        const centerY = topLeft.y + cell / 2;
        const jumpOffset = Math.sin(renderPosition.progress * Math.PI) * cell * 0.18;

        const isSelected = state.selectedAgentId === agent.id;
        if (isSelected) {
          ctx.save();
          ctx.strokeStyle = "rgba(214, 178, 107, 0.9)";
          ctx.lineWidth = Math.max(1.5, cell * 0.055);
          ctx.beginPath();
          ctx.ellipse(centerX, topLeft.y + cell * 0.82, cell * 0.34, cell * 0.13, 0, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
        }

        if (cell >= 8 && isSelected) {
          ctx.save();
          ctx.fillStyle = "rgba(117, 196, 182, 0.035)";
          ctx.strokeStyle = "rgba(117, 196, 182, 0.075)";
          ctx.lineWidth = Math.max(1, cell * 0.025);
          ctx.beginPath();
          ctx.arc(centerX, centerY, agent.profile.vision * cell, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
          ctx.restore();
        }

        if (cell < 8) {
          ctx.fillStyle = agent.carrying > 0 ? "#d6b26b" : "#75c4b6";
          ctx.fillRect(
            Math.floor(centerX - 1),
            Math.floor(centerY - jumpOffset - 1),
            3,
            3
          );
          continue;
        }

        const age = state.simSeconds - agent.bornAt;
        const remainingRatio = clamp(
          (STARTER_OBJECT_LIFETIME - age) / STARTER_OBJECT_LIFETIME,
          0,
          1
        );
        const bob = Math.sin(now / 520 + agent.id) * cell * 0.015;
        const gaugeInset = Math.max(2, cell * 0.14);
        const gaugeHeight = Math.max(2, cell * 0.07);

        ctx.save();
        ctx.beginPath();
        ctx.rect(
          topLeft.x - cell * 0.1,
          topLeft.y - cell * 0.3,
          cell * 1.2,
          cell * 1.4
        );
        ctx.clip();
        ctx.imageSmoothingEnabled = false;
        ctx.fillStyle = "rgba(5, 9, 10, " + (0.18 - jumpOffset / cell * 0.45) + ")";
        ctx.beginPath();
        ctx.ellipse(
          centerX,
          topLeft.y + cell * 0.84,
          cell * (0.18 - jumpOffset / cell * 0.2),
          cell * 0.055,
          0,
          0,
          Math.PI * 2
        );
        ctx.fill();
        ctx.fillStyle = "rgba(27, 40, 42, 0.82)";
        ctx.fillRect(
          topLeft.x + gaugeInset,
          topLeft.y + cell * 0.08,
          cell - gaugeInset * 2,
          gaugeHeight
        );
        ctx.fillStyle = "rgba(151, 211, 150, 0.88)";
        ctx.fillRect(
          topLeft.x + gaugeInset,
          topLeft.y + cell * 0.08,
          (cell - gaugeInset * 2) * remainingRatio,
          gaugeHeight
        );

        if (starterObjectSprite.complete && starterObjectSprite.naturalWidth > 0) {
          const spriteHeight = cell * 0.72;
          const spriteWidth = spriteHeight *
            (starterObjectSprite.naturalWidth / starterObjectSprite.naturalHeight);
          ctx.drawImage(
            starterObjectSprite,
            topLeft.x + (cell - spriteWidth) / 2,
            topLeft.y + cell * 0.23 + bob - jumpOffset,
            spriteWidth,
            spriteHeight
          );
        }

        if (agent.carrying > 0) {
          const carriedSize = Math.max(3, cell * 0.14);
          ctx.fillStyle = "rgba(214, 178, 107, 0.9)";
          ctx.fillRect(
            topLeft.x + cell - carriedSize - cell * 0.08,
            topLeft.y + cell - carriedSize - cell * 0.08 - jumpOffset,
            carriedSize,
            carriedSize
          );
        }
        ctx.restore();
      }
    }
    function drawFlashes(now) {
      state.flashes = state.flashes.filter((flash) => now - flash.startedAt < 680);

      for (const flash of state.flashes) {
        const age = now - flash.startedAt;
        const ratio = 1 - age / 680;
        const pos = worldToScreen(flash.x, flash.y);
        const cell = state.camera.zoom;
        const glow = ctx.createRadialGradient(
          pos.x + cell / 2,
          pos.y + cell / 2,
          0,
          pos.x + cell / 2,
          pos.y + cell / 2,
          cell * 0.74
        );
        glow.addColorStop(0, `rgba(220, 196, 130, ${0.34 * ratio})`);
        glow.addColorStop(0.72, `rgba(196, 174, 112, ${0.12 * ratio})`);
        glow.addColorStop(1, "rgba(196, 174, 112, 0)");

        ctx.save();
        ctx.fillStyle = glow;
        ctx.fillRect(pos.x, pos.y, cell, cell);
        ctx.restore();
      }
    }

    function render(now) {
      const elapsed = Math.min(0.25, (now - state.lastFrame) / 1000);
      state.lastFrame = now;
      state.simSeconds += elapsed * TIME_SCALE;
      updateAgents(elapsed * TIME_SCALE);

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#111619";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      drawTerrain();
      drawGrid();
      drawSharedTrails();
      drawFoodSpots();
      drawWorldBounds();
      drawFlashes(now);
      drawColony(now);
      drawAgents(now);

      requestAnimationFrame(render);
    }

    function setZoom(nextZoom, anchorX = canvas.width / 2, anchorY = canvas.height / 2) {
      const before = screenToWorld(anchorX, anchorY);
      state.camera.zoom = clamp(nextZoom, MIN_ZOOM, MAX_ZOOM);
      const after = screenToWorld(anchorX, anchorY);
      state.camera.x += before.x - after.x;
      state.camera.y += before.y - after.y;
      clampCamera();
    }

    function focusColony() {
      state.camera.x = COLONY_CENTER.x;
      state.camera.y = COLONY_CENTER.y;
      state.camera.zoom = 48;
      clampCamera();
    }

    function clampCamera() {
      state.camera.x = clamp(state.camera.x, 0, WORLD_SIZE);
      state.camera.y = clamp(state.camera.y, 0, WORLD_SIZE);
    }

    canvas.addEventListener("wheel", (event) => {
      event.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      const anchorX = (event.clientX - rect.left) * dpr;
      const anchorY = (event.clientY - rect.top) * dpr;
      const factor = event.deltaY < 0 ? 1.12 : 0.72;
      setZoom(state.camera.zoom * factor, anchorX, anchorY);
    }, { passive: false });

    canvas.addEventListener("pointerdown", (event) => {
      canvas.setPointerCapture(event.pointerId);
      state.dragging = true;
      state.didDrag = false;
      state.dragStart.x = event.clientX;
      state.dragStart.y = event.clientY;
      state.cameraStart.x = state.camera.x;
      state.cameraStart.y = state.camera.y;
    });

    canvas.addEventListener("pointermove", (event) => {
      if (!state.dragging) {
        return;
      }

      const dpr = window.devicePixelRatio || 1;
      const dx = (event.clientX - state.dragStart.x) * dpr;
      const dy = (event.clientY - state.dragStart.y) * dpr;
      if (Math.abs(dx) + Math.abs(dy) > 4) {
        state.didDrag = true;
      }
      state.camera.x = state.cameraStart.x - dx / state.camera.zoom;
      state.camera.y = state.cameraStart.y - dy / state.camera.zoom;
      clampCamera();
    });

    canvas.addEventListener("pointerup", (event) => {
      if (!state.didDrag) {
        const rect = canvas.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;
        const world = screenToWorld(
          (event.clientX - rect.left) * dpr,
          (event.clientY - rect.top) * dpr
        );
        const cellX = Math.floor(world.x);
        const cellY = Math.floor(world.y);
        const isColonyCell =
          cellX >= COLONY_ORIGIN.x &&
          cellX < COLONY_ORIGIN.x + COLONY_SIZE &&
          cellY >= COLONY_ORIGIN.y &&
          cellY < COLONY_ORIGIN.y + COLONY_SIZE;

        if (isColonyCell) {
          openColonyPanel();
        } else {
          state.selectedAgentId = null;
          updateAgentList();
          state.flashes.push({
            x: cellX,
            y: cellY,
            startedAt: performance.now()
          });
        }
      }

      state.dragging = false;
    });

    canvas.addEventListener("pointercancel", () => {
      state.dragging = false;
    });

function openColonyPanel() {
      colonyPanel.classList.add("is-open");
      colonyPanel.setAttribute("aria-hidden", "false");
    }

    colonyFocusButton.addEventListener("click", focusColony);
    colonyOpenButton.addEventListener("click", openColonyPanel);

    panelClose.addEventListener("click", () => {
      colonyPanel.classList.remove("is-open");
      colonyPanel.setAttribute("aria-hidden", "true");
    });

    function profileOutputText(name, value) {
      if (name === "speed") {
        return value.toFixed(1) + "칸/초";
      }
      if (name === "vision") {
        return Math.round(value) + "칸";
      }
      if (name === "memoryTrips") {
        return Math.round(value) + "회";
      }
      if (name === "capacity") {
        return Math.round(value).toString();
      }
      return Math.round(value * 100) + "%";
    }

    document.querySelectorAll("[data-profile]").forEach((input) => {
      input.addEventListener("input", () => {
        const name = input.dataset.profile;
        const currentValue = state.draftProfile[name];
        const requestedValue = Number(input.value);
        const step = Number(input.step);
        const requestedSteps = Math.round(
          Math.abs(requestedValue - currentValue) / step
        );
        const appliedSteps = Math.min(
          requestedSteps,
          state.evolutionPoints
        );
        if (appliedSteps <= 0) {
          input.value = currentValue.toString();
          return;
        }
        const direction = Math.sign(requestedValue - currentValue);
        const appliedValue = Number(
          (currentValue + direction * appliedSteps * step).toFixed(4)
        );
        state.evolutionPoints -= appliedSteps;
        state.draftProfile[name] = appliedValue;
        input.value = appliedValue.toString();
        const output = document.querySelector(
          '[data-output="' + name + '"]'
        );
        if (output) {
          output.textContent = profileOutputText(name, appliedValue);
        }
        updateColonyPanel();
      });
    });

    const AGENT_MODE_LABELS = {
      search: "탐색", approach: "먹이 접근", harvest: "채집",
      return: "귀환", commute: "길 왕복"
    };

    function selectAgent(agent) {
      state.selectedAgentId = agent.id;
      focusAgent(agent);
      updateAgentList();
    }

    function focusAgent(agent) {
      const position = interpolatedAgentPosition(agent);
      state.camera.x = position.x + 0.5;
      state.camera.y = position.y + 0.5;
      state.camera.zoom = Math.max(state.camera.zoom, 32);
      clampCamera();
    }

    let renderedAgentListSignature = "";

    function updateAgentList() {
      agentListCount.textContent = state.agents.length.toString();
      const signature = state.agents.map((agent) => agent.id).join(",");
      if (signature !== renderedAgentListSignature) {
        const fragment = document.createDocumentFragment();
        for (const agent of state.agents) {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "agent-item";
          button.dataset.agentId = agent.id.toString();
          button.innerHTML =
            "<img data-agent-avatar alt=\"\">" +
            "<span data-agent-mode></span>" +
            "<small data-agent-carry></small>";
          const avatar = button.querySelector("[data-agent-avatar]");
          avatar.src = starterObjectSprite.src;
          avatar.alt = "개체 #" + agent.id;
          button.setAttribute("aria-label", "개체 #" + agent.id + " 선택");
          button.title = "개체 #" + agent.id;
          button.addEventListener("click", () => {
            const current = state.agents.find(
              (candidate) => candidate.id === Number(button.dataset.agentId)
            );
            if (current) {
              selectAgent(current);
            }
          });
          fragment.appendChild(button);
        }
        agentList.replaceChildren(fragment);
        renderedAgentListSignature = signature;
      }

      for (const agent of state.agents) {
        const button = agentList.querySelector(
          '[data-agent-id="' + agent.id + '"]'
        );
        if (!button) {
          continue;
        }
        button.className = "agent-item" +
          (state.selectedAgentId === agent.id ? " is-selected" : "");


        button.querySelector("[data-agent-mode]").textContent =
          AGENT_MODE_LABELS[agent.mode] || agent.mode;
        button.querySelector("[data-agent-carry]").textContent =
          "운반 " + agent.carrying;

      }

      const selected = state.agents.find((agent) => agent.id === state.selectedAgentId);
      if (!selected) {
        state.selectedAgentId = null;
        agentDetail.textContent = "개체를 선택하면 DNA를 표시합니다.";
        return;
      }
      const p = selected.profile;
      agentDetail.innerHTML = "<strong>개체 #" + selected.id + " · " + (AGENT_MODE_LABELS[selected.mode] || selected.mode) + "</strong><div class=\"agent-detail-grid\"><span>운반 <strong>" + selected.carrying + "</strong></span><span>발걸음 <strong>" + profileOutputText("speed", p.speed) + "</strong></span><span>운반력 <strong>" + p.capacity + "</strong></span><span>시야 <strong>" + p.vision + "칸</strong></span><span>직진성 <strong>" + profileOutputText("direction", p.direction) + "</strong></span><span>개척성 <strong>" + profileOutputText("novelty", p.novelty) + "</strong></span><span>풍요 선호 <strong>" + profileOutputText("richness", p.richness) + "</strong></span><span>기억력 <strong>" + p.memoryTrips + "회</strong></span><span>길눈 <strong>" + profileOutputText("routeSense", p.routeSense) + "</strong></span></div>";
    }
    document.querySelectorAll("[data-profile-adjust]").forEach((button) => {
      button.addEventListener("click", () => {
        const name = button.dataset.profileAdjust;
        const input = document.querySelector('[data-profile="' + name + '"]');
        const nextValue = clamp(state.draftProfile[name] + Number(button.dataset.direction) * Number(input.step), Number(input.min), Number(input.max));
        if (nextValue === state.draftProfile[name]) return;
        input.value = nextValue.toString();
        input.dispatchEvent(new Event("input"));
      });
    });
    function updateColonyPanel() {
      const requiredFood = birthCost();
      storedFoodOutput.textContent = Math.floor(state.colonyFood).toString();
      birthCostOutput.textContent = requiredFood.toString();
      foodProgressFill.style.width =
        (clamp(state.colonyFood / requiredFood, 0, 1) * 100).toFixed(1) + "%";
      agentCountOutput.textContent = state.agents.length.toString();
      evolutionPointsOutput.textContent = state.evolutionPoints.toString();
      updateAgentList();
      document.querySelectorAll("[data-profile]").forEach((input) => {
        input.disabled = state.evolutionPoints <= 0;
      });      document.querySelectorAll("[data-profile-adjust]").forEach((button) => {
        const input = document.querySelector('[data-profile="' + button.dataset.profileAdjust + '"]');
        const atLimit = Number(button.dataset.direction) < 0 ? Number(input.value) <= Number(input.min) : Number(input.value) >= Number(input.max);
        button.disabled = state.evolutionPoints <= 0 || atLimit;
      });
    }

    window.addEventListener("resize", resizeCanvas);

    resizeCanvas();
    focusColony();
    spawnAgent(false);
    setInterval(updateColonyPanel, 200);
    updateColonyPanel();
    requestAnimationFrame(render);
  </script>
</body>
</html>
