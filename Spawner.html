    }

    function distanceToLand(x, y, maxDistance = 12) {
      for (let radius = 1; radius <= maxDistance; radius += 1) {
        for (let offset = -radius; offset <= radius; offset += 1) {
          if (
            isLandCell(x + offset, y - radius) ||
            isLandCell(x + offset, y + radius) ||
            isLandCell(x - radius, y + offset) ||
            isLandCell(x + radius, y + offset)
          ) {
            return radius;
          }
        }
      }

      return maxDistance + 1;
    }

    function terrainAt(x, y) {
      const key = x + "," + y;
      if (terrainCache.has(key)) {
        return terrainCache.get(key);
      }

      let terrain = "land";
      if (isLandCell(x, y)) {
        const mountainTerrain = mountainTerrainAt(x, y);
        terrain = mountainTerrain === "land" ?
          vegetationTerrainAt(x, y) : mountainTerrain;
      } else {
        const coastDistance = distanceToLand(x, y);
        terrain = coastDistance <= 2 ? "coast" :
          coastDistance <= 6 ? "shallow" : "deep";
      }

      terrainCache.set(key, terrain);
      return terrain;
    }

    function foodSpotForRegion(regionX, regionY) {
      const key = regionX + "," + regionY;
      if (foodSpotCache.has(key)) {
        return foodSpotCache.get(key);
      }

      const originX = regionX * FOOD_REGION_SIZE;
      const originY = regionY * FOOD_REGION_SIZE;
      const starterFoodX = Math.floor(COLONY_CENTER.x) + 8;
      const starterFoodY = Math.floor(COLONY_CENTER.y);
      const isStarterRegion =
        regionX === Math.floor(starterFoodX / FOOD_REGION_SIZE) &&
        regionY === Math.floor(starterFoodY / FOOD_REGION_SIZE);
      const centerX = isStarterRegion ? starterFoodX :
        originX + 2 + Math.floor(
          hashNoise(regionX + 1409, regionY - 811) * (FOOD_REGION_SIZE - 4)
        );
      const centerY = isStarterRegion ? starterFoodY :
        originY + 2 + Math.floor(
          hashNoise(regionX - 271, regionY + 2903) * (FOOD_REGION_SIZE - 4)
        );
      const terrain = terrainAt(centerX, centerY);

      if (terrain !== "land" && terrain !== "grassland") {
        foodSpotCache.set(key, []);
        return [];
      }

      const spawnChance = terrain === "grassland" ? 0.64 : 0.24;
      if (
        !isStarterRegion &&
        hashNoise(regionX + 7013, regionY - 2017) >= spawnChance
      ) {
        foodSpotCache.set(key, []);
        return [];
      }

      const sizeNoise = hashNoise(regionX - 1871, regionY + 4513);
      const targetSize = isStarterRegion ? 3 : terrain === "grassland" ?
        5 + Math.floor(sizeNoise * 8) :
        1 + Math.floor(sizeNoise * 3);
      const cells = [{ x: centerX, y: centerY }];
      const occupied = new Set([centerX + "," + centerY]);
      const frontier = [];

      function addFrontier(x, y) {
        const frontierKey = x + "," + y;
        if (
          occupied.has(frontierKey) ||
          x < 0 ||
          y < 0 ||
          x >= WORLD_SIZE ||
          y >= WORLD_SIZE ||
          terrainAt(x, y) !== terrain ||
          frontier.some((cell) => cell.key === frontierKey)
        ) {
          return;
        }

        const distance = Math.hypot(x - centerX, y - centerY);
        frontier.push({
          x,
          y,
          key: frontierKey,
          score: hashNoise(x * 31 + regionX, y * 17 + regionY) -
            distance * 0.08
        });
      }

      addFrontier(centerX + 1, centerY);
      addFrontier(centerX - 1, centerY);
      addFrontier(centerX, centerY + 1);
      addFrontier(centerX, centerY - 1);

      while (cells.length < targetSize && frontier.length > 0) {
        let bestIndex = 0;
        for (let index = 1; index < frontier.length; index += 1) {
          if (frontier[index].score > frontier[bestIndex].score) {
            bestIndex = index;
          }
        }

        const next = frontier.splice(bestIndex, 1)[0];
        occupied.add(next.key);
        cells.push({ x: next.x, y: next.y });
        addFrontier(next.x + 1, next.y);
        addFrontier(next.x - 1, next.y);
        addFrontier(next.x, next.y + 1);
        addFrontier(next.x, next.y - 1);
      }

      for (const foodCell of cells) {
        foodCell.amount = FOOD_PER_CELL;
        foodCellMap.set(foodCell.x + "," + foodCell.y, foodCell);
      }

      const spot = { terrain, cells };
      foodSpotCache.set(key, spot);
      return spot;
    }

    function birthCost(population = state.agents.length) {
      const livingPopulation = Math.max(1, population);
      return Math.max(
        5,
        Math.round(5 * Math.pow(livingPopulation, 1.3))
      );
    }

    function ensureFoodAround(x, y, radius) {
      const startRegionX = Math.floor((x - radius) / FOOD_REGION_SIZE);
      const startRegionY = Math.floor((y - radius) / FOOD_REGION_SIZE);
      const endRegionX = Math.floor((x + radius) / FOOD_REGION_SIZE);
      const endRegionY = Math.floor((y + radius) / FOOD_REGION_SIZE);

      for (let regionY = startRegionY; regionY <= endRegionY; regionY += 1) {
        for (let regionX = startRegionX; regionX <= endRegionX; regionX += 1) {
          foodSpotForRegion(regionX, regionY);
        }
      }
    }

    function foodCellAt(x, y) {
      ensureFoodAround(x, y, 1);
      return foodCellMap.get(x + "," + y) || null;
    }

    function isWalkable(x, y) {
      if (x < 0 || y < 0 || x >= WORLD_SIZE || y >= WORLD_SIZE || colonyAt(x, y)) {
        return false;
      }
      const terrain = terrainAt(x, y);
      return terrain === "land" ||
        terrain === "grassland" ||
        terrain === "forest" ||
        terrain === "lowMountain";
    }

    function createAgentName() {
      const prefix = AGENT_NAME_PREFIXES[Math.floor(Math.random() * AGENT_NAME_PREFIXES.length)];
      const suffix = AGENT_NAME_SUFFIXES[Math.floor(Math.random() * AGENT_NAME_SUFFIXES.length)];
      const base = prefix + " " + suffix;
      const usedNames = new Set(state.agents.map((agent) => agent.name));
      let name = base;
      let number = state.nextAgentId;
      while (usedNames.has(name)) {
        name = base + " " + number;
        number += 1;
      }
      return name;
    }

    function spawnAgent(grantEvolutionPoint = true) {
      const position = chooseSpawnPosition();
      if (!position) {
        return null;
      }
      const agent = {
        id: state.nextAgentId,
        name: createAgentName(),
        x: position.x,
        y: position.y,
        profile: { ...state.draftProfile },
        evolution: { ...state.draftEvolution },
        bornAt: state.simSeconds,
        carrying: 0,
        moveBudget: 0,
        mode: "search",
        targetFoodKey: null,
        rememberedFoodKey: null,
        sharedTrailFoodKey: null,
        rememberedRoute: null,
        memoryTripsRemaining: 0,
        routeIndex: 0,
        path: [{ ...position }],
        returnPath: [],
        movementTargetKey: null,
        movementVisits: new Map(),
        visited: new Set([position.x + "," + position.y]),
        lastDirection: null,
        straightSteps: 0,
        stepCount: 0,
        renderFromX: position.x,
        renderFromY: position.y,
        moveStartedAt: state.simSeconds,
        moveDuration: 0
      };
      state.nextAgentId += 1;
      state.agents.push(agent);
      if (grantEvolutionPoint) {
        state.evolutionPoints += 1;
      }
      return agent;
    }

    function visibleFoodFor(agent) {
      const radius = agent.evolution.antenna ? 3 : AGENT_VISION;
      ensureFoodAround(agent.x, agent.y, radius);
      let best = null;
      let bestScore = -Infinity;

      for (let offsetY = -radius; offsetY <= radius; offsetY += 1) {
        for (let offsetX = -radius; offsetX <= radius; offsetX += 1) {
          const distance = Math.hypot(offsetX, offsetY);
          if (distance > radius) {
            continue;
          }
          const x = agent.x + offsetX;
          const y = agent.y + offsetY;
          const foodCell = foodCellMap.get(x + "," + y);
          if (!foodCell || foodCell.amount <= 0) {
            continue;
          }
          const richness = foodCell.amount / FOOD_PER_CELL;
          const score =
            -distance * (1 - agent.profile.richness) +
            richness * radius * agent.profile.richness;
          if (score > bestScore) {
            best = foodCell;
            bestScore = score;
          }
        }
      }
      return best;
    }

    function walkableNeighbors(x, y) {
      return [
        { x: x + 1, y, dx: 1, dy: 0 },
        { x: x - 1, y, dx: -1, dy: 0 },
        { x, y: y + 1, dx: 0, dy: 1 },
        { x, y: y - 1, dx: 0, dy: -1 }
      ].filter((cell) => isWalkable(cell.x, cell.y));
    }

    function isAgentCellOccupied(x, y, excludedAgent) {
      return state.agents.some((other) => other !== excludedAgent && (
        (other.x === x && other.y === y) ||
        (state.simSeconds - other.moveStartedAt < other.moveDuration &&
          other.renderFromX === x && other.renderFromY === y)
      ));
    }

    function moveAgent(agent, destination, rememberPath = true) {
      if (state.simSeconds - agent.moveStartedAt < agent.moveDuration ||
        isAgentCellOccupied(destination.x, destination.y, agent)) {
        return false;
      }
      if (!isWalkable(destination.x, destination.y) ||
        Math.abs(destination.x - agent.x) + Math.abs(destination.y - agent.y) !== 1) {
        return false;
      }
      const nextDirection = {
        dx: destination.x - agent.x,
        dy: destination.y - agent.y
      };
      const keptDirection = agent.lastDirection &&
        agent.lastDirection.dx === nextDirection.dx &&
        agent.lastDirection.dy === nextDirection.dy;
      agent.straightSteps = keptDirection ? agent.straightSteps + 1 : 1;
      agent.lastDirection = nextDirection;
      const rendered = interpolatedAgentPosition(agent);
      agent.renderFromX = rendered.x;
      agent.renderFromY = rendered.y;
      agent.moveStartedAt = state.simSeconds;
      agent.moveDuration = 1 / agentSpeed(agent);
      agent.x = destination.x;
      agent.y = destination.y;
      agent.stepCount += 1;
      agent.visited.add(agent.x + "," + agent.y);
      if (rememberPath) {
        agent.path.push({ x: agent.x, y: agent.y });
      } else {
        agent.returnPath.push({ x: agent.x, y: agent.y });
      }
      return true;
    }

    function foodScentAt(x, y) {
      ensureFoodAround(x, y, FOOD_SCENT_RADIUS);
      let strength = 0;

      for (let offsetY = -FOOD_SCENT_RADIUS; offsetY <= FOOD_SCENT_RADIUS; offsetY += 1) {
        for (let offsetX = -FOOD_SCENT_RADIUS; offsetX <= FOOD_SCENT_RADIUS; offsetX += 1) {
          const distance = Math.hypot(offsetX, offsetY);
          if (distance > FOOD_SCENT_RADIUS) {
            continue;
          }
          const foodCell = foodCellMap.get((x + offsetX) + "," + (y + offsetY));
          if (!foodCell || foodCell.amount <= 0) {
            continue;
          }
          const remainingRatio = foodCell.amount / FOOD_PER_CELL;
          const falloff = 1 - distance / (FOOD_SCENT_RADIUS + 1);
          strength += remainingRatio * falloff * falloff;
        }
      }
      return strength;
    }

    function scentGuidedStep(agent, neighbors) {
      const currentStrength = foodScentAt(agent.x, agent.y);
      let best = null;
      let bestStrength = currentStrength + 0.01;

      for (const neighbor of neighbors) {
        const strength = foodScentAt(neighbor.x, neighbor.y);
        const tieBreak = hashNoise(
          neighbor.x + agent.id * 307,
          neighbor.y + agent.stepCount * 43
        ) * 0.002;
        if (strength + tieBreak > bestStrength) {
          best = neighbor;
          bestStrength = strength + tieBreak;
        }
      }

      if (!best) {
        return null;
      }
      const guidanceRoll = hashNoise(
        agent.id * 719 + agent.stepCount,
        agent.x * 23 + agent.y * 47
      );
      return guidanceRoll < FOOD_SCENT_GUIDANCE_CHANCE ? best : null;
    }
    function registerSharedTrail(route, foodKey, strengthGain = 1) {
      if (!route || route.length < 2 || !foodKey) {
        return;
      }

      for (let index = 0; index < route.length - 1; index += 1) {
        const from = route[index];
        const to = route[index + 1];
        const cellKey = from.x + "," + from.y;
        let entries = state.sharedTrails.get(cellKey);
        if (!entries) {
          entries = [];
          state.sharedTrails.set(cellKey, entries);
        }
        let entry = entries.find(
          (candidate) =>
            candidate.foodKey === foodKey &&
            candidate.nextX === to.x &&
            candidate.nextY === to.y
        );
        if (!entry) {
          entry = {
            fromX: from.x,
            fromY: from.y,
            nextX: to.x,
            nextY: to.y,
            foodKey,
            strength: 0
          };
          entries.push(entry);
        }
        entry.strength += strengthGain;
      }
    }

    function rebuildSharedTrailIndex(road) {
      for (const [cellKey, entries] of state.sharedTrails) {
        const remaining = entries.filter(
          (entry) => entry.foodKey !== road.foodKey
        );
        if (remaining.length > 0) {
          state.sharedTrails.set(cellKey, remaining);
        } else {
          state.sharedTrails.delete(cellKey);
        }
      }
      registerSharedTrail(road.route, road.foodKey, road.usageCount);
    }

    function registerRoadJourney(agent) {
      const route = agent.rememberedRoute;
      const foodKey = agent.rememberedFoodKey;
      if (!route || route.length < 2 || !foodKey) {
        return;
      }

      let road = state.roads.get(foodKey);
      if (!road) {
        road = {
          id: "road-" + foodKey,
          foodKey,
          route: route.map((cell) => ({ ...cell })),
          usageCount: 0,
          optimizationCount: 0,
          knownCells: new Set()
        };
        state.roads.set(foodKey, road);
      }
      road.usageCount += 1;
      for (const cellKey of agent.visited) {
        road.knownCells.add(cellKey);
      }
      for (const cell of route) {
        road.knownCells.add(cell.x + "," + cell.y);
      }
      if (route.length < road.route.length) {
        road.route = route.map((cell) => ({ ...cell }));
      }

      const goal = road.route[road.route.length - 1];
      const collectiveScale = 1 + Math.log2(road.usageCount + 1) * 5;
      const expansionBudget = Math.max(
        road.route.length,
        Math.floor(road.route.length * collectiveScale)
      );
      const optimized = bestKnownColonyRoute(
        { visited: road.knownCells },
        goal,
        expansionBudget,
        road.route
      );
      if (optimized && optimized.length < road.route.length) {
        road.route = optimized;
        road.optimizationCount += 1;
      }
      rebuildSharedTrailIndex(road);
    }
    function sharedTrailStep(agent, neighbors) {
      const entries = state.sharedTrails.get(agent.x + "," + agent.y) || [];
      let best = null;
      let bestScore = -Infinity;

      for (const entry of entries) {
        if (
          agent.sharedTrailFoodKey &&
          entry.foodKey !== agent.sharedTrailFoodKey
        ) {
          continue;
        }
        const foodCell = foodCellMap.get(entry.foodKey);
        if (!foodCell || foodCell.amount <= 0) {
          continue;
        }
        const neighbor = neighbors.find(
          (candidate) =>
            candidate.x === entry.nextX && candidate.y === entry.nextY
        );
        if (!neighbor) {
          continue;
        }
        const score = Math.log1p(entry.strength) + hashNoise(
          entry.nextX + agent.id * 887,
          entry.nextY + agent.stepCount * 59
        ) * 0.04;
        if (score > bestScore) {
          best = { neighbor, entry };
          bestScore = score;
        }
      }

      if (!best) {
        const foodCell = foodCellMap.get(agent.sharedTrailFoodKey);
        if (foodCell && foodCell.amount > 0) {
          return chooseStepToward(agent, foodCell, neighbors);
        }
        agent.sharedTrailFoodKey = null;
        return null;
      }
      if (agent.sharedTrailFoodKey) {
        return best.neighbor;
      }
      const followRoll = hashNoise(
        agent.id * 977 + agent.stepCount,
        agent.x * 41 - agent.y * 19
      );
      if (followRoll >= SHARED_TRAIL_FOLLOW_CHANCE) {
        return null;
      }
      agent.sharedTrailFoodKey = best.entry.foodKey;
      return best.neighbor;
    }
    function chooseExplorationStep(agent, neighbors) {
      if (neighbors.length === 0) {
        return null;
      }

      const trailStep = sharedTrailStep(agent, neighbors);
      if (trailStep) {
        return trailStep;
      }

      const scentedStep = scentGuidedStep(agent, neighbors);
      if (scentedStep) {
        return scentedStep;
      }

      const forward = agent.lastDirection ? neighbors.find(
        (neighbor) =>
          neighbor.dx === agent.lastDirection.dx &&
          neighbor.dy === agent.lastDirection.dy
      ) : null;
      const directionFatigue = clamp(1 - agent.straightSteps / 6, 0.25, 1);
      const directionChance = agent.profile.direction * directionFatigue;
      const directionRoll = hashNoise(
        agent.id * 401 + agent.stepCount,
        agent.x * 17 + agent.y * 29
      );

      if (forward && directionRoll < directionChance) {
        return forward;
      }

      let candidates = forward && neighbors.length > 1 ?
        neighbors.filter((neighbor) => neighbor !== forward) : [...neighbors];
      const unvisited = candidates.filter(
        (neighbor) => !agent.visited.has(neighbor.x + "," + neighbor.y)
      );
      const noveltyRoll = hashNoise(
        agent.id * 613 + agent.stepCount,
        agent.x * 37 - agent.y * 11
      );
      if (unvisited.length > 0 && noveltyRoll < agent.profile.novelty) {
        candidates = unvisited;
      }

      let best = null;
      let bestScore = -Infinity;
      for (const candidate of candidates) {
        const terrain = terrainAt(candidate.x, candidate.y);
        const terrainPenalty = terrain === "lowMountain" ?
          0.28 : terrain === "forest" ? 0.08 : 0;
        const score = hashNoise(
          candidate.x + agent.id * 101,
          candidate.y + agent.stepCount * 53
        ) - terrainPenalty;
        if (score > bestScore) {
          best = candidate;
          bestScore = score;
        }
      }

      return best;
    }
    function chooseStepToward(agent, target, neighbors) {
      if (neighbors.length === 0) {
        return null;
      }
      const targetKey = agent.mode + ":" + target.x + "," + target.y;
      if (agent.movementTargetKey !== targetKey) {
        agent.movementTargetKey = targetKey;
        agent.movementVisits.clear();
      }
      const currentKey = agent.x + "," + agent.y;
      agent.movementVisits.set(currentKey, (agent.movementVisits.get(currentKey) || 0) + 1);
      let best = null;
      let bestScore = Infinity;

      for (const neighbor of neighbors) {
        const distance =
          Math.abs(target.x - neighbor.x) + Math.abs(target.y - neighbor.y);
        const jitter = hashNoise(
          neighbor.x + agent.id * 211,
          neighbor.y + agent.stepCount * 97
        ) * 0.16;
        if (distance === 0) {
          return neighbor;
        }
        const visits = agent.movementVisits.get(neighbor.x + "," + neighbor.y) || 0;
        const score = distance + visits * 3 + jitter;
        if (score < bestScore) {
          best = neighbor;
          bestScore = score;
        }
      }
      return best;
    }

    function moveAgentAlongRoute(agent, direction, neighbors) {
      const route = agent.rememberedRoute;
      const preferred = route[agent.routeIndex];
      const goal = direction < 0 ? route[0] : route[route.length - 1];
      const destination = neighbors.find(
        (cell) => preferred && cell.x === preferred.x && cell.y === preferred.y
      ) || chooseStepToward(agent, goal, neighbors);
      if (!destination || !moveAgent(agent, destination, direction > 0)) {
        return;
      }
      for (let index = agent.routeIndex; index >= 0 && index < route.length; index += direction) {
        const cell = route[index];
        if (cell.x === agent.x && cell.y === agent.y) {
          agent.routeIndex = index + direction;
          break;
        }
      }
    }

    function knownPath(agent, start, goal, expansionBudget) {
      if (!isWalkable(start.x, start.y) || !isWalkable(goal.x, goal.y)) {
        return null;
      }
      const startKey = start.x + "," + start.y;
      const goalKey = goal.x + "," + goal.y;
      const open = [startKey];
      const openSet = new Set(open);
      const cameFrom = new Map();
      const cost = new Map([[startKey, 0]]);
      const coordinates = new Map([[startKey, { ...start }], [goalKey, { ...goal }]]);
      let expansions = 0;

      while (open.length > 0 && expansions < expansionBudget) {
        let bestIndex = 0;
        let bestEstimate = Infinity;
        for (let index = 0; index < open.length; index += 1) {
          const key = open[index];
          const cell = coordinates.get(key);
          const estimate =
            (cost.get(key) || 0) +
            Math.abs(goal.x - cell.x) +
            Math.abs(goal.y - cell.y);
          if (estimate < bestEstimate) {
            bestEstimate = estimate;
            bestIndex = index;
          }
        }

        const currentKey = open.splice(bestIndex, 1)[0];
        openSet.delete(currentKey);
        const current = coordinates.get(currentKey);
        if (currentKey === goalKey) {
          const path = [{ ...goal }];
          let traceKey = goalKey;
          while (cameFrom.has(traceKey)) {
            traceKey = cameFrom.get(traceKey);
            path.push({ ...coordinates.get(traceKey) });
          }
          path.reverse();
          return path;
        }

        expansions += 1;
        for (const neighbor of walkableNeighbors(current.x, current.y)) {
          const neighborKey = neighbor.x + "," + neighbor.y;
          if (
            neighborKey !== goalKey &&
            neighborKey !== startKey &&
            !agent.visited.has(neighborKey)
          ) {
            continue;
          }

          coordinates.set(neighborKey, { x: neighbor.x, y: neighbor.y });
          const nextCost = (cost.get(currentKey) || 0) + 1;
          if (!cost.has(neighborKey) || nextCost < cost.get(neighborKey)) {
            cameFrom.set(neighborKey, currentKey);
            cost.set(neighborKey, nextCost);
            if (!openSet.has(neighborKey)) {
              open.push(neighborKey);
              openSet.add(neighborKey);
            }
          }
        }
      }

      return null;
    }

    function bestKnownColonyRoute(agent, goal, expansionBudget, fallbackRoute) {
      let bestRoute = fallbackRoute;
      for (const accessCell of colonyBoundaryCells()) {
        const candidate = knownPath(agent, accessCell, goal, expansionBudget);
        if (candidate && (!bestRoute || candidate.length < bestRoute.length)) {
          bestRoute = candidate;
        }
      }
      return bestRoute;
    }

    function optimizeRememberedRoute(agent) {
      const route = agent.rememberedRoute;
      if (!route || route.length < 3 || agent.profile.routeSense <= 0) {
        return route;
      }

      const start = route[0];
      const goal = route[route.length - 1];
      const expansionBudget = Math.max(
        route.length,
        Math.floor(route.length * (1 + agent.profile.routeSense * 8))
      );
      const optimized = knownPath(agent, start, goal, expansionBudget);
      return optimized && optimized.length < route.length ? optimized : route;
    }

    function forgetFoodRoute(agent) {
      agent.targetFoodKey = null;
      agent.rememberedFoodKey = null;
      agent.sharedTrailFoodKey = null;
      agent.rememberedRoute = null;
      agent.memoryTripsRemaining = 0;
      agent.routeIndex = 0;
      agent.mode = "search";
      agent.path = [{ x: agent.x, y: agent.y }];
      agent.returnPath = [];
      agent.movementTargetKey = null;
      agent.movementVisits.clear();
    }

    function harvestAtCurrentCell(agent) {
      const foodCell = foodCellAt(agent.x, agent.y);
      if (!foodCell || foodCell.amount <= 0) {
        forgetFoodRoute(agent);
        return;
      }
      const isRememberedTrip =
        agent.mode === "commute" && agent.rememberedRoute;
      const followedRoad = agent.sharedTrailFoodKey === agent.x + "," + agent.y ?
        state.roads.get(agent.sharedTrailFoodKey) : null;
      const amount = Math.min(agent.evolution.arms ? 3 : AGENT_CAPACITY, foodCell.amount);
      foodCell.amount -= amount;
      agent.carrying = amount;
      agent.sharedTrailFoodKey = null;
      agent.rememberedFoodKey = agent.x + "," + agent.y;

      if (!isRememberedTrip) {
        if (followedRoad && followedRoad.route.length >= 2) {
          agent.rememberedRoute = followedRoad.route.map((cell) => ({ ...cell }));
        } else {
          let boundaryIndex = 0;
          for (let index = agent.path.length - 1; index >= 0; index -= 1) {
            const cell = agent.path[index];
            if (isColonyBoundaryCell(cell.x, cell.y)) {
              boundaryIndex = index;
              break;
            }
          }
          agent.rememberedRoute = agent.path
            .slice(boundaryIndex)
            .map((cell) => ({ ...cell }));
        }
        agent.memoryTripsRemaining = agent.profile.memoryTrips;
      } else {
        agent.rememberedRoute = agent.path.map((cell) => ({ ...cell }));
      }

      agent.returnPath = [{ x: agent.x, y: agent.y }];
      agent.mode = "return";
      agent.routeIndex = agent.rememberedRoute.length - 2;
    }

    function depositFood(agent) {
      if (agent.returnPath.length > 0) {
        agent.rememberedRoute = agent.returnPath
          .map((cell) => ({ ...cell }))
          .reverse();
        agent.returnPath = [];
      }

      state.colonyFood += agent.carrying;
      agent.carrying = 0;
      registerRoadJourney(agent);

      const rememberedFood = agent.rememberedFoodKey ?
        foodCellMap.get(agent.rememberedFoodKey) : null;
      if (
        rememberedFood &&
        rememberedFood.amount > 0 &&
        agent.rememberedRoute &&
        agent.memoryTripsRemaining > 0
      ) {
        agent.rememberedRoute = optimizeRememberedRoute(agent);
        agent.memoryTripsRemaining -= 1;
        agent.mode = "commute";
        agent.routeIndex = 1;
        agent.path = [{ x: agent.x, y: agent.y }];
        return;
      }
      forgetFoodRoute(agent);
    }

    function stepAgent(agent) {
      const neighbors = walkableNeighbors(agent.x, agent.y)
        .filter((cell) => !isAgentCellOccupied(cell.x, cell.y, agent));
      if (agent.mode === "return") {
        if (isColonyBoundaryCell(agent.x, agent.y)) {
          depositFood(agent);
          return;
        }
        if (agent.rememberedRoute && agent.routeIndex >= 0) {
          moveAgentAlongRoute(agent, -1, neighbors);
          return;
        }
        const homeStep = chooseStepToward(
          agent,
          nearestColonyBoundaryCell(agent.x, agent.y),
          neighbors
        );
        if (homeStep) {
          moveAgent(agent, homeStep, false);
        }
        return;
      }

      if (agent.mode === "commute") {
        if (
          agent.rememberedRoute &&
          agent.routeIndex < agent.rememberedRoute.length
        ) {
          moveAgentAlongRoute(agent, 1, neighbors);
          return;
        }
        harvestAtCurrentCell(agent);
        return;
      }

      if (agent.mode === "approach") {
        const target = agent.targetFoodKey ?
          foodCellMap.get(agent.targetFoodKey) : null;
        if (!target || target.amount <= 0) {
          forgetFoodRoute(agent);
          return;
        }
        if (agent.x === target.x && agent.y === target.y) {
          harvestAtCurrentCell(agent);
          return;
        }
        const targetStep = chooseStepToward(agent, target, neighbors);
        if (targetStep) {
          moveAgent(agent, targetStep);
        }
        return;
      }

      const visibleFood = visibleFoodFor(agent);
      if (visibleFood) {
        agent.targetFoodKey = visibleFood.x + "," + visibleFood.y;
        agent.mode = "approach";
        return;
      }

      const explorationStep = chooseExplorationStep(agent, neighbors);
      if (explorationStep) {
        moveAgent(agent, explorationStep);
      }
    }

    function updateAgents(elapsed) {
      state.agents = state.agents.filter(
        (agent) => state.simSeconds - agent.bornAt < STARTER_OBJECT_LIFETIME
      );
      while (state.colonyFood >= birthCost()) {
        const cost = birthCost();
        if (!spawnAgent()) {
          break;
        }
        state.colonyFood -= cost;
      }
      const agentsAtFrameStart = [...state.agents];
      for (const agent of agentsAtFrameStart) {
        agent.moveBudget = Math.min(
          1,
          agent.moveBudget + elapsed * agentSpeed(agent)
        );
        if (agent.moveBudget >= 1 &&
          state.simSeconds - agent.moveStartedAt >= agent.moveDuration) {
          agent.moveBudget -= 1;
          stepAgent(agent);
        }
      }
    }

    function worldToScreen(x, y) {
      return {
        x: canvas.width / 2 + (x - state.camera.x) * state.camera.zoom,
        y: canvas.height / 2 + (y - state.camera.y) * state.camera.zoom
      };
    }

    function screenToWorld(x, y) {
      return {
        x: state.camera.x + (x - canvas.width / 2) / state.camera.zoom,
        y: state.camera.y + (y - canvas.height / 2) / state.camera.zoom
      };
    }

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = Math.max(1, Math.floor(rect.width * dpr));
      canvas.height = Math.max(1, Math.floor(rect.height * dpr));
      ctx.setTransform(1, 0, 0, 1, 0, 0);
    }

    function drawGrid() {
      const zoom = state.camera.zoom;
      const gridStep = zoom >= 28 ? 1 : zoom >= 14 ? 2 : zoom >= 6 ? 5 : zoom >= 3 ? 10 : 20;
      const topLeft = screenToWorld(0, 0);
      const bottomRight = screenToWorld(canvas.width, canvas.height);
      const startX = Math.floor(topLeft.x / gridStep) * gridStep;
      const startY = Math.floor(topLeft.y / gridStep) * gridStep;

      ctx.lineWidth = 1;
      ctx.strokeStyle = "rgba(82, 103, 108, 0.18)";
      ctx.beginPath();

      for (let x = startX; x <= bottomRight.x; x += gridStep) {
        const screen = worldToScreen(x, 0).x;
        ctx.moveTo(Math.round(screen) + 0.5, 0);
        ctx.lineTo(Math.round(screen) + 0.5, canvas.height);
      }

      for (let y = startY; y <= bottomRight.y; y += gridStep) {
        const screen = worldToScreen(0, y).y;
        ctx.moveTo(0, Math.round(screen) + 0.5);
        ctx.lineTo(canvas.width, Math.round(screen) + 0.5);
      }

      ctx.stroke();
    }

    function drawTerrain() {
      const topLeft = screenToWorld(0, 0);
      const bottomRight = screenToWorld(canvas.width, canvas.height);
      const cell = state.camera.zoom;
      const terrainStep = cell >= 8 ? 1 : cell >= 4 ? 2 : 4;
      const startX = clamp(
        Math.floor(topLeft.x / terrainStep) * terrainStep,
        0,
        WORLD_SIZE - 1
      );
      const startY = clamp(
        Math.floor(topLeft.y / terrainStep) * terrainStep,
        0,
        WORLD_SIZE - 1
      );
      const endX = clamp(Math.ceil(bottomRight.x), 0, WORLD_SIZE - 1);
      const endY = clamp(Math.ceil(bottomRight.y), 0, WORLD_SIZE - 1);

      for (let y = startY; y <= endY; y += terrainStep) {
        for (let x = startX; x <= endX; x += terrainStep) {
          const screen = worldToScreen(x, y);
          const sampleX = clamp(
            x + Math.floor(terrainStep / 2),
            0,
            WORLD_SIZE - 1
          );
          const sampleY = clamp(
            y + Math.floor(terrainStep / 2),
            0,
            WORLD_SIZE - 1
          );
          ctx.fillStyle = TERRAIN_COLORS[terrainAt(sampleX, sampleY)];
          ctx.fillRect(
            Math.floor(screen.x),
            Math.floor(screen.y),
            Math.ceil(cell * terrainStep) + 1,
            Math.ceil(cell * terrainStep) + 1
          );
        }
      }
    }

    function drawSharedTrails() {
      const topLeft = screenToWorld(0, 0);
      const bottomRight = screenToWorld(canvas.width, canvas.height);
      const cell = state.camera.zoom;

      ctx.save();
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      for (const entries of state.sharedTrails.values()) {
        for (const entry of entries) {
          if (
            entry.fromX < topLeft.x - 1 ||
            entry.fromX > bottomRight.x + 1 ||
            entry.fromY < topLeft.y - 1 ||
            entry.fromY > bottomRight.y + 1
          ) {
            continue;
          }
          const foodCell = foodCellMap.get(entry.foodKey);
          const isActive = foodCell && foodCell.amount > 0;
          const from = worldToScreen(entry.fromX + 0.5, entry.fromY + 0.5);
          const to = worldToScreen(entry.nextX + 0.5, entry.nextY + 0.5);
          const alpha = isActive ?
            Math.min(0.58, 0.22 + Math.log1p(entry.strength) * 0.09) : 0.08;
          ctx.strokeStyle = "rgba(151, 124, 79, " + alpha + ")";
          ctx.lineWidth = Math.max(1, Math.min(6, cell * 0.13));
          ctx.beginPath();
          ctx.moveTo(from.x, from.y);
          ctx.lineTo(to.x, to.y);
          ctx.stroke();
        }
      }
      ctx.restore();
    }
    function isSelectedObject(kind, target) {
      return state.selection !== null &&
        state.selection.kind === kind && state.selection.target === target;
    }

    function selectObject(kind, target) {
      state.selection = target ? { kind, target } : null;
      if (kind === "agent" && target) selectPanelTab(agentTab);
      for (const item of colonyList.children) {
        if (item.dataset.colonyId) {
          item.setAttribute("aria-current", String(kind === "colony" &&
            target !== null && item.dataset.colonyId === String(target.id)));
        }
      }
      updateAgentList();
    }

    function updateSelection() {
      const selection = state.selection;
      if (!selection) return;
      const exists = selection.kind === "agent" ? state.agents.includes(selection.target) :
        selection.kind === "colony" ? colonyEntries.includes(selection.target) &&
          state.simSeconds < COLONY_LIFETIME : selection.target.amount > 0;
      if (!exists) {
        selectObject(null, null);
        closeColonyMenu();
      }
    }

    function drawSelectionOutline(sprite, x, y, width, height) {
      let outline = selectionOutlines.get(sprite);
      if (!outline) {
        outline = document.createElement("canvas");
        outline.width = sprite.naturalWidth || sprite.width;
        outline.height = sprite.naturalHeight || sprite.height;
        const context = outline.getContext("2d");
        context.drawImage(sprite, 0, 0);
        context.globalCompositeOperation = "source-in";
        context.fillStyle = selectionColor;
        context.fillRect(0, 0, outline.width, outline.height);
        selectionOutlines.set(sprite, outline);
      }
      const thickness = Math.max(2, state.camera.zoom * 0.06);
      ctx.save();
      ctx.globalAlpha = 1;
      if (sprite === foodSelectionShape) {
        ctx.beginPath();
        ctx.rect(x - thickness, y - thickness, width + thickness * 2, height + thickness * 2);
        ctx.rect(x, y, width, height);
        ctx.clip("evenodd");
      }
      for (let index = 0; index < 16; index += 1) {
        const angle = index * Math.PI / 8;
        ctx.drawImage(outline, x + Math.cos(angle) * thickness,
          y + Math.sin(angle) * thickness, width, height);
      }
      ctx.restore();
    }

    function drawFoodSpots() {
      const topLeft = screenToWorld(0, 0);
      const bottomRight = screenToWorld(canvas.width, canvas.height);
      const startRegionX = Math.floor(topLeft.x / FOOD_REGION_SIZE) - 1;
      const startRegionY = Math.floor(topLeft.y / FOOD_REGION_SIZE) - 1;
      const endRegionX = Math.floor(bottomRight.x / FOOD_REGION_SIZE) + 1;
      const endRegionY = Math.floor(bottomRight.y / FOOD_REGION_SIZE) + 1;
      const cell = state.camera.zoom;
      const inset = cell >= 10 ? cell * 0.2 : cell >= 4 ? 1 : 0;

      for (let regionY = startRegionY; regionY <= endRegionY; regionY += 1) {
        for (let regionX = startRegionX; regionX <= endRegionX; regionX += 1) {
          const spot = foodSpotForRegion(regionX, regionY);
          if (!spot.cells) {
            continue;
          }

          ctx.fillStyle = FOOD_COLORS[spot.terrain];
          for (const foodCell of spot.cells) {
            if (foodCell.amount <= 0) {
              continue;
            }

            const screen = worldToScreen(foodCell.x, foodCell.y);
            const remainingRatio = clamp(foodCell.amount / FOOD_PER_CELL, 0, 1);
            const spriteReady = foodSprite.complete && foodSprite.naturalWidth > 0;
            const labelSize = Math.max(8, Math.min(12, cell * 0.17));
            const barInset = Math.max(1, cell * 0.1);
            const barHeight = Math.max(2, cell * 0.045);
            const rowHeight = cell >= 24 ? labelSize : barHeight;
            const rowY = screen.y + cell - Math.max(1, cell * 0.06) - rowHeight / 2;
            const barY = rowY - barHeight / 2;
            const foodTop = cell * 0.03;
            const foodBottom = cell >= 10 ? rowY - screen.y - rowHeight / 2 - Math.max(1, cell * 0.035) : cell * 0.97;
            const foodSize = Math.max(1, Math.min(cell * 0.96, foodBottom - foodTop));
            const foodX = screen.x + (cell - foodSize) / 2;
            const foodY = screen.y + foodTop;
            if (isSelectedObject("food", foodCell)) {
              if (spriteReady) {
                drawSelectionOutline(foodSprite, foodX, foodY, foodSize, foodSize);
              } else {
                drawSelectionOutline(foodSelectionShape,
                  Math.floor(screen.x + inset), Math.floor(screen.y + inset),
                  Math.max(1, Math.ceil(cell - inset * 2)),
                  Math.max(1, Math.ceil(cell - inset * 2)));
              }
            }
            ctx.save();
            ctx.globalAlpha = 0.35 + remainingRatio * 0.65;
            if (spriteReady) {
              ctx.imageSmoothingEnabled = false;
              ctx.drawImage(foodSprite, foodX, foodY, foodSize, foodSize);
            } else {
              ctx.fillStyle = FOOD_COLORS[spot.terrain];
              ctx.fillRect(
                Math.floor(screen.x + inset),
                Math.floor(screen.y + inset),
                Math.max(1, Math.ceil(cell - inset * 2)),
                Math.max(1, Math.ceil(cell - inset * 2))
              );
            }
            ctx.restore();

            if (cell >= 10) {
              ctx.save();
              ctx.font = "600 " + labelSize + "px Arial, Malgun Gothic, sans-serif";
              const labelGap = cell >= 24 ? Math.max(2, cell * 0.04) : 0;
              const labelWidth = cell >= 24 ? ctx.measureText(FOOD_PER_CELL.toString()).width : 0;
              const barWidth = cell - barInset * 2 - labelGap - labelWidth;
              ctx.fillStyle = "rgba(17, 24, 23, 0.82)";
              ctx.fillRect(screen.x + barInset, barY, barWidth, barHeight);
              ctx.fillStyle = "rgba(238, 194, 101, 0.94)";
              ctx.fillRect(screen.x + barInset, barY, barWidth * remainingRatio, barHeight);
              if (cell >= 24) {
                const label = Math.ceil(foodCell.amount).toString();
                const labelX = screen.x + barInset + barWidth * remainingRatio + labelGap;
                ctx.fillStyle = "rgba(255, 244, 214, 0.98)";
                ctx.strokeStyle = "rgba(13, 21, 20, 0.95)";
                ctx.lineWidth = Math.max(2, Math.min(3, cell * 0.04));
                ctx.lineJoin = "round";
                ctx.textAlign = "left";
                ctx.textBaseline = "middle";
                ctx.strokeText(label, labelX, rowY);
                ctx.fillText(label, labelX, rowY);
              }
              ctx.restore();
            }
          }
        }
      }
    }

    function drawWorldBounds() {
      const topLeft = worldToScreen(0, 0);
      const bottomRight = worldToScreen(WORLD_SIZE, WORLD_SIZE);

      ctx.lineWidth = 2;
      ctx.strokeStyle = "rgba(117, 196, 182, 0.26)";
      ctx.strokeRect(
        topLeft.x,
        topLeft.y,
        bottomRight.x - topLeft.x,
        bottomRight.y - topLeft.y
      );
    }

    function drawColony(now) {
      const cell = state.camera.zoom;
      const size = COLONY_SIZE * cell;
      const topLeft = worldToScreen(COLONY_ORIGIN.x, COLONY_ORIGIN.y);
      const center = worldToScreen(COLONY_CENTER.x, COLONY_CENTER.y);

      const glowRadius = size * 0.7;
      const glow = ctx.createRadialGradient(
        center.x,
        center.y,
        0,
        center.x,
        center.y,
        glowRadius
      );
      glow.addColorStop(0, "rgba(117, 196, 182, 0.38)");
      glow.addColorStop(0.56, "rgba(117, 196, 182, 0.12)");
      glow.addColorStop(1, "rgba(117, 196, 182, 0)");
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(center.x, center.y, glowRadius, 0, Math.PI * 2);
      ctx.fill();

      ctx.save();
      ctx.imageSmoothingEnabled = false;
      if (colonySprite.complete && colonySprite.naturalWidth > 0) {
        if (isSelectedObject("colony", colonyEntries[0])) {
          drawSelectionOutline(colonySprite, topLeft.x, topLeft.y, size, size);
        }
        ctx.drawImage(colonySprite, topLeft.x, topLeft.y, size, size);
      }

      ctx.restore();
    }

    function interpolatedAgentPosition(agent) {
      if (!agent.moveDuration) {
        return { x: agent.x, y: agent.y, progress: 1 };
      }
      const rawProgress = clamp(
        (state.simSeconds - agent.moveStartedAt) / agent.moveDuration,
        0,
        1
      );
      const smoothProgress = rawProgress * rawProgress * (3 - 2 * rawProgress);
      return {
        x: agent.renderFromX + (agent.x - agent.renderFromX) * smoothProgress,
        y: agent.renderFromY + (agent.y - agent.renderFromY) * smoothProgress,
        progress: rawProgress
      };
    }

    function drawAgents(now) {
      const cell = state.camera.zoom;

      for (const agent of state.agents) {
        const renderPosition = interpolatedAgentPosition(agent);
        const topLeft = worldToScreen(renderPosition.x, renderPosition.y);
        const centerX = topLeft.x + cell / 2;
        const centerY = topLeft.y + cell / 2;
        const stride = Math.sin(renderPosition.progress * Math.PI);
        const jumpOffset = stride * cell * (agent.evolution.feet ? 0.035 : 0.18);

        const isSelected = isSelectedObject("agent", agent);
        if (cell < 8) {
          if (isSelected) {
            drawSelectionOutline(foodSelectionShape,
              Math.floor(centerX - 1), Math.floor(centerY - jumpOffset - 1), 3, 3);
          }
          ctx.fillStyle = agent.carrying > 0 ? "#d6b26b" : "#75c4b6";
          ctx.fillRect(
            Math.floor(centerX - 1),
            Math.floor(centerY - jumpOffset - 1),
            3,
            3
          );
          continue;
        }

        const bob = Math.sin(now / 520 + agent.id) * cell * 0.015;

        ctx.save();
        ctx.beginPath();
        ctx.rect(
          topLeft.x - cell * 0.1,
          topLeft.y - cell * 0.3,
          cell * 1.2,
          cell * 1.4
        );
        ctx.clip();
        ctx.imageSmoothingEnabled = false;
        ctx.fillStyle = "rgba(5, 9, 10, " + (0.18 - jumpOffset / cell * 0.45) + ")";
        ctx.beginPath();
        ctx.ellipse(
          centerX,
          topLeft.y + cell * 0.84,
          cell * (0.18 - jumpOffset / cell * 0.2),
          cell * 0.055,
          0,
          0,
          Math.PI * 2
        );
        ctx.fill();
        const sprite = agentSprite(agent);
        if (sprite.complete && sprite.naturalWidth > 0) {
          const spriteHeight = cell * 0.98;
          const spriteWidth = spriteHeight * sprite.naturalWidth / sprite.naturalHeight;
          const spriteX = topLeft.x + (cell - spriteWidth) / 2;
          const spriteY = topLeft.y + cell * 0.02 + bob - jumpOffset;
          const footY = spriteY + spriteHeight * 0.94;
          ctx.translate(centerX, footY);
          if (agent.evolution.feet) {
            ctx.rotate(stride * (agent.stepCount % 2 ? 1 : -1) * 0.09);
          }
          if (isSelected) {
            drawSelectionOutline(sprite, spriteX - centerX, spriteY - footY,
              spriteWidth, spriteHeight);
          }
          ctx.drawImage(sprite, spriteX - centerX, spriteY - footY,
            spriteWidth, spriteHeight);
        }
        ctx.restore();
      }
    }
    function drawFlashes(now) {
      state.flashes = state.flashes.filter((flash) => now - flash.startedAt < 680);

      for (const flash of state.flashes) {
        const age = now - flash.startedAt;
        const ratio = 1 - age / 680;
        const pos = worldToScreen(flash.x, flash.y);
        const cell = state.camera.zoom;
        const glow = ctx.createRadialGradient(
          pos.x + cell / 2,
          pos.y + cell / 2,
          0,
          pos.x + cell / 2,
          pos.y + cell / 2,
          cell * 0.74
        );
        glow.addColorStop(0, `rgba(220, 196, 130, ${0.34 * ratio})`);
        glow.addColorStop(0.72, `rgba(196, 174, 112, ${0.12 * ratio})`);
        glow.addColorStop(1, "rgba(196, 174, 112, 0)");

        ctx.save();
        ctx.fillStyle = glow;
        ctx.fillRect(pos.x, pos.y, cell, cell);
        ctx.restore();
      }
    }

    function render(now) {
      const elapsed = Math.min(0.25, (now - state.lastFrame) / 1000);
      state.lastFrame = now;
      state.simSeconds += elapsed * TIME_SCALE;
      updateAgents(elapsed * TIME_SCALE);
      updateSelection();

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#111619";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      drawTerrain();
      drawGrid();
      drawSharedTrails();
      drawFoodSpots();
      drawWorldBounds();
      drawFlashes(now);
      drawColony(now);
      drawAgents(now);
      positionColonyMenus();
      positionHelpTooltip();

      requestAnimationFrame(render);
    }

    function setZoom(nextZoom, anchorX = canvas.width / 2, anchorY = canvas.height / 2) {
      const before = screenToWorld(anchorX, anchorY);
      state.camera.zoom = clamp(nextZoom, MIN_ZOOM, MAX_ZOOM);
      const after = screenToWorld(anchorX, anchorY);
      state.camera.x += before.x - after.x;
      state.camera.y += before.y - after.y;
      clampCamera();
    }

    function focusColony() {
      state.camera.x = COLONY_CENTER.x;
      state.camera.y = COLONY_CENTER.y;
      state.camera.zoom = MAX_ZOOM;
      clampCamera();
    }

    function clampCamera() {
      state.camera.x = clamp(state.camera.x, 0, WORLD_SIZE);
      state.camera.y = clamp(state.camera.y, 0, WORLD_SIZE);
    }

    canvas.addEventListener("wheel", (event) => {
      event.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      const anchorX = (event.clientX - rect.left) * dpr;
      const anchorY = (event.clientY - rect.top) * dpr;
      const factor = event.deltaY < 0 ? 1.12 : 0.72;
      setZoom(state.camera.zoom * factor, anchorX, anchorY);
    }, { passive: false });

    canvas.addEventListener("pointerdown", (event) => {
      canvas.setPointerCapture(event.pointerId);
      state.dragging = true;
      state.didDrag = false;
      state.dragStart.x = event.clientX;
      state.dragStart.y = event.clientY;
      state.cameraStart.x = state.camera.x;
      state.cameraStart.y = state.camera.y;
    });

    canvas.addEventListener("pointermove", (event) => {
      if (!state.dragging) {
        return;
      }

      const dpr = window.devicePixelRatio || 1;
      const dx = (event.clientX - state.dragStart.x) * dpr;
      const dy = (event.clientY - state.dragStart.y) * dpr;
      if (Math.abs(dx) + Math.abs(dy) > 4) {
        state.didDrag = true;
      }
      state.camera.x = state.cameraStart.x - dx / state.camera.zoom;
      state.camera.y = state.cameraStart.y - dy / state.camera.zoom;
      clampCamera();
    });

    canvas.addEventListener("pointerup", (event) => {
      if (!state.didDrag) {
        const rect = canvas.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;
        const world = screenToWorld(
          (event.clientX - rect.left) * dpr,
          (event.clientY - rect.top) * dpr
        );
        const cellX = Math.floor(world.x);
        const cellY = Math.floor(world.y);
        const colony = colonyAt(cellX, cellY);
        const food = foodCellAt(cellX, cellY);
        const agent = [...state.agents].reverse().find((candidate) => {
          const position = interpolatedAgentPosition(candidate);
          const jump = Math.sin(position.progress * Math.PI) * 0.18;
          const bob = Math.sin(state.lastFrame / 520 + candidate.id) * 0.015;
          const height = state.camera.zoom < 8 ? 3 / state.camera.zoom : 0.72;
          const width = state.camera.zoom < 8 ? height : height *
            starterObjectSprite.naturalWidth / starterObjectSprite.naturalHeight;
          const left = position.x + (1 - width) / 2;
          const top = position.y + (state.camera.zoom < 8 ? (1 - height) / 2 : 0.23 + bob) - jump;
          return world.x >= left && world.x <= left + width &&
            world.y >= top && world.y <= top + height;
        });

        if (agent) {
          closeColonyMenu();
          selectObject("agent", agent);
        } else if (colony && state.simSeconds < COLONY_LIFETIME) {
          openColonyPanel(colony);
        } else if (food && food.amount > 0) {
          closeColonyMenu();
          selectObject("food", food);
        } else {
          closeColonyMenu();
          selectObject(null, null);
          state.flashes.push({
            x: cellX,
            y: cellY,
            startedAt: performance.now()
          });
        }
      }

      state.dragging = false;
    });

    canvas.addEventListener("pointercancel", () => {
      state.dragging = false;
    });

    function selectPanelTab(tab) {
      const showColony = tab === colonyTab;
      agentTab.setAttribute("aria-selected", String(!showColony));
      colonyTab.setAttribute("aria-selected", String(showColony));
      agentTab.tabIndex = showColony ? -1 : 0;
      colonyTab.tabIndex = showColony ? 0 : -1;
      agentTabPanel.hidden = showColony;
      colonyPanel.hidden = !showColony;
    }

    function positionColonyMenus() {
      if (colonyMenu.hidden) return;
      const rect = canvas.getBoundingClientRect();
      const anchor = worldToScreen(colonyMenuEntry.x + COLONY_SIZE, colonyMenuEntry.y);
      const gap = 10;
      const availableWidth = Math.max(1, rect.width - gap * 2);
      colonyMenu.style.width = Math.min(260, availableWidth) + "px";
      evolutionPanel.style.width = Math.min(240, availableWidth) + "px";
      const beside = !evolutionPanel.hidden && colonyMenu.offsetWidth + evolutionPanel.offsetWidth + gap <= availableWidth;
      const childWidth = beside ? evolutionPanel.offsetWidth + gap : 0;
      const left = clamp(rect.left + anchor.x * rect.width / canvas.width + gap, rect.left + gap,
        Math.max(rect.left + gap, rect.right - colonyMenu.offsetWidth - childWidth - gap));
      const top = clamp(rect.top + anchor.y * rect.height / canvas.height, gap,
        Math.max(gap, window.innerHeight - colonyMenu.offsetHeight - gap));
      colonyMenu.style.left = left + "px";
      colonyMenu.style.top = top + "px";
      evolutionPanel.style.left = (beside ? left + colonyMenu.offsetWidth + gap : left) + "px";
      const childTop = beside ? top : Math.min(top + colonyMenu.offsetHeight + gap, window.innerHeight / 2);
      evolutionPanel.style.top = childTop + "px";
      evolutionPanel.style.maxHeight = Math.max(1, window.innerHeight - childTop - gap) + "px";
    }

    function closeColonyMenu() {
      closeEvolutionPanel();
      colonyMenu.hidden = true;
      canvas.focus();
    }

    function closeEvolutionPanel() {
      hideHelpTooltip();
      evolutionPanel.hidden = true;
      evolutionOpenButton.setAttribute("aria-expanded", "false");
    }

    evolutionOpenButton.addEventListener("click", () => {
      hideHelpTooltip();
      evolutionPanel.hidden = !evolutionPanel.hidden;
      evolutionOpenButton.setAttribute("aria-expanded", String(!evolutionPanel.hidden));
      positionColonyMenus();
    });
    evolutionClose.addEventListener("click", () => {
      closeEvolutionPanel();
      evolutionOpenButton.focus();
    });

    const colonySearch = document.getElementById("colony-search");
    const colonyList = document.getElementById("colony-list");
    const colonyResults = document.getElementById("colony-results");
    const colonyPrevious = document.getElementById("colony-previous");
    const colonyNext = document.getElementById("colony-next");
    const colonyPage = document.getElementById("colony-page");
    let colonyListPage = 0;

    function renderColonyList() {
      const query = colonySearch.value.trim().toLocaleLowerCase();
      const matches = colonyEntries.filter((entry) => entry.name.toLocaleLowerCase().includes(query) || String(entry.id).includes(query));
      const pageCount = Math.max(1, Math.ceil(matches.length / 50));
      colonyListPage = clamp(colonyListPage, 0, pageCount - 1);
      const start = colonyListPage * 50;
      const fragment = document.createDocumentFragment();
      for (const entry of matches.slice(start, start + 50)) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "colony-item";
        button.dataset.colonyId = String(entry.id);
        button.setAttribute("aria-current", String(isSelectedObject("colony", entry)));
        const name = document.createElement("strong");
        name.textContent = entry.name;
        const location = document.createElement("small");
        location.textContent = "#" + entry.id + " · (" + entry.x + ", " + entry.y + ")";
        button.append(name, location);
        button.addEventListener("click", () => selectColonyEntry(entry));
        fragment.append(button);
      }
      if (!matches.length) {
        const empty = document.createElement("p");
        empty.className = "colony-empty";
        empty.textContent = query ? "검색 결과가 없습니다." : "둥지가 없습니다.";
        fragment.append(empty);
      }
      colonyList.replaceChildren(fragment);
      colonyResults.textContent = "전체 " + colonyEntries.length.toLocaleString() + "개 · 검색 " + matches.length.toLocaleString() + "개";
      colonyPage.textContent = (colonyListPage + 1) + " / " + pageCount;
      colonyPrevious.disabled = colonyListPage === 0;
      colonyNext.disabled = colonyListPage >= pageCount - 1;
    }

    function selectColonyEntry(entry) {
      state.camera.x = entry.x + COLONY_SIZE / 2;
      state.camera.y = entry.y + COLONY_SIZE / 2;
      clampCamera();
      openColonyPanel(entry);
    }

    colonySearch.addEventListener("input", () => {
      colonyListPage = 0;
      renderColonyList();
      colonyList.scrollTop = 0;
    });
    colonyPrevious.addEventListener("click", () => {
      colonyListPage -= 1;
      renderColonyList();
      colonyList.scrollTop = 0;
    });
    colonyNext.addEventListener("click", () => {
      colonyListPage += 1;
      renderColonyList();
      colonyList.scrollTop = 0;
    });
    renderColonyList();

    function openColonyPanel(entry) {
      selectObject("colony", entry);
      colonyMenuEntry = entry;
      closeEvolutionPanel();
      colonyMenu.hidden = false;
      positionColonyMenus();
      colonyMenuClose.focus();
    }

    colonyMenuClose.addEventListener("click", closeColonyMenu);
    [agentTab, colonyTab].forEach((tab) => {
      tab.addEventListener("click", () => selectPanelTab(tab));
      tab.addEventListener("keydown", (event) => {
        if (!["ArrowLeft", "ArrowRight", "Home", "End"].includes(event.key)) return;
        event.preventDefault();
        const next = event.key === "Home" ? agentTab : event.key === "End" ? colonyTab : tab === agentTab ? colonyTab : agentTab;
        selectPanelTab(next);
        next.focus();
      });
    });
    document.addEventListener("keydown", (event) => {
      if (event.key !== "Escape") return;
      if (!helpTooltip.hidden) {
        hideHelpTooltip();
        event.preventDefault();
        return;
      }
      if (colonyMenu.hidden) return;
      if (!evolutionPanel.hidden) {
        closeEvolutionPanel();
        evolutionOpenButton.focus();
      } else {
        closeColonyMenu();
      }
      event.preventDefault();
    });

    document.querySelectorAll("[data-evolution]").forEach((button) => {
      button.addEventListener("click", () => {
        if (state.evolutionPoints < EVOLUTION_COST) return;
        const name = button.dataset.evolution;
        state.evolutionPoints -= EVOLUTION_COST;
        state.draftEvolution[name] = !state.draftEvolution[name];
        updateColonyPanel();
      });
    });

    agentNameInput.addEventListener("input", () => {
      agentNameInput.setCustomValidity("");
      agentNameStatus.textContent = "";
    });
    agentNameForm.addEventListener("submit", (event) => {
      event.preventDefault();
      const agent = state.selection && state.selection.kind === "agent" ? state.selection.target : null;
      if (!agent || !state.agents.includes(agent)) return;
      const name = agentNameInput.value.trim();
      if (!name) {
        agentNameInput.setCustomValidity("이름을 입력해 주세요.");
        agentNameInput.reportValidity();
        return;
      }
      agent.name = name;
      agentNameInput.value = name;
      agentNameStatus.textContent = "이름을 변경했습니다.";
      updateAgentList();
    });

    function updateAgentDetails() {
      const agent = state.selection && state.selection.kind === "agent" ? state.selection.target : null;
      agentDetails.hidden = !agent;
      if (!agent) {
        editedAgentId = null;
        return;
      }
      selectedAgentName.textContent = agent.name;
      if (editedAgentId !== agent.id) {
        agentNameInput.value = agent.name;
        agentNameInput.setCustomValidity("");
        agentNameStatus.textContent = "";
        editedAgentId = agent.id;
      }
    }

    const AGENT_MODE_LABELS = {
      search: "탐색", approach: "먹이 접근", harvest: "채집",
      return: "귀환", commute: "길 왕복"
    };

    function selectAgent(agent) {
      closeColonyMenu();
      selectObject("agent", agent);
      focusAgent(agent);
      updateAgentList();
    }

    function focusAgent(agent) {
      const position = interpolatedAgentPosition(agent);
      state.camera.x = position.x + 0.5;
      state.camera.y = position.y + 0.5;
      clampCamera();
    }

    let renderedAgentListSignature = "";

    function updateAgentList() {
      updateAgentDetails();
      agentListCount.textContent = state.agents.length.toString();
      const signature = state.agents.map((agent) => agent.id).join(",");
      if (signature !== renderedAgentListSignature) {
        const fragment = document.createDocumentFragment();
        for (const agent of state.agents) {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "agent-item";
          button.dataset.agentId = agent.id.toString();
          button.innerHTML =
            "<img data-agent-avatar alt=\"\">" +
            "<strong data-agent-name></strong>" +
            "<span data-agent-mode></span>" +
            "<small data-agent-carry></small>";
          const avatar = button.querySelector("[data-agent-avatar]");
          avatar.src = agentSprite(agent).src;
          button.addEventListener("click", () => {
            const current = state.agents.find(
              (candidate) => candidate.id === Number(button.dataset.agentId)
            );
            if (current) {
              selectAgent(current);
            }
          });
          fragment.appendChild(button);
        }
        agentList.replaceChildren(fragment);
        renderedAgentListSignature = signature;
      }

      for (const agent of state.agents) {
        const button = agentList.querySelector(
          '[data-agent-id="' + agent.id + '"]'
        );
        if (!button) {
          continue;
        }
        button.className = "agent-item" +
          (isSelectedObject("agent", agent) ? " is-selected" : "");


        const avatar = button.querySelector("[data-agent-avatar]");
        const sprite = agentSprite(agent);
        if (avatar.src !== sprite.src) avatar.src = sprite.src;
        avatar.alt = agent.name;
        button.setAttribute("aria-label", agent.name + " 선택");
        button.title = agent.name;
        button.querySelector("[data-agent-name]").textContent = agent.name;
        button.querySelector("[data-agent-mode]").textContent =
          AGENT_MODE_LABELS[agent.mode] || agent.mode;
        button.querySelector("[data-agent-carry]").textContent =
          "운반 " + agent.carrying;

      }

    }
    function updateColonyPanel() {
      const requiredFood = birthCost();
      storedFoodOutput.textContent = Math.floor(state.colonyFood).toString();
      birthCostOutput.textContent = requiredFood.toString();
      foodProgressFill.style.width =
        (clamp(state.colonyFood / requiredFood, 0, 1) * 100).toFixed(1) + "%";
      agentCountOutput.textContent = state.agents.length.toString();
      evolutionPointsOutput.textContent = state.evolutionPoints.toString();
      document.querySelectorAll("[data-evolution]").forEach((button) => {
        const enabled = state.draftEvolution[button.dataset.evolution];
        button.setAttribute("aria-pressed", String(enabled));
        button.querySelector("strong").textContent = enabled ? "적용" : "미적용";
        button.disabled = state.evolutionPoints < EVOLUTION_COST;
        const action = enabled ? "적용 해제" : "적용";
        button.title = action + " · " + EVOLUTION_COST + "포인트";
        button.setAttribute("aria-label", button.querySelector(".evolution-name").textContent + " " + action);
      });
      updateAgentList();
    }

    const agentPanel = document.getElementById("agent-panel");
    const agentPanelResize = document.getElementById("agent-panel-resize");
    let agentPanelDrag = null;

    function setAgentPanelWidth(width) {
      const minimum = Math.min(220, window.innerWidth * 0.55);
      const maximum = Math.min(560, window.innerWidth * 0.7);
      const value = Math.max(minimum, Math.min(maximum, width));
      document.documentElement.style.setProperty("--agent-panel-width", value + "px");
      agentPanelResize.setAttribute("aria-valuemin", Math.round(minimum));
      agentPanelResize.setAttribute("aria-valuemax", Math.round(maximum));
      agentPanelResize.setAttribute("aria-valuenow", Math.round(value));
      resizeCanvas();
    }

    agentPanelResize.addEventListener("pointerdown", (event) => {
      if (event.button !== 0 || agentPanelDrag) return;
      event.preventDefault();
      agentPanelDrag = { pointerId: event.pointerId, x: event.clientX, width: agentPanel.getBoundingClientRect().width };
      agentPanelResize.setPointerCapture(event.pointerId);
    });
    agentPanelResize.addEventListener("pointermove", (event) => {
      if (!agentPanelDrag || event.pointerId !== agentPanelDrag.pointerId) return;
      setAgentPanelWidth(agentPanelDrag.width + agentPanelDrag.x - event.clientX);
    });
    function stopAgentPanelResize(event) {
      if (!agentPanelDrag || event.pointerId !== agentPanelDrag.pointerId) return;
      agentPanelDrag = null;
      if (agentPanelResize.hasPointerCapture(event.pointerId)) agentPanelResize.releasePointerCapture(event.pointerId);
    }
    agentPanelResize.addEventListener("pointerup", stopAgentPanelResize);
    agentPanelResize.addEventListener("pointercancel", stopAgentPanelResize);
    agentPanelResize.addEventListener("lostpointercapture", stopAgentPanelResize);
    agentPanelResize.addEventListener("keydown", (event) => {
      if (event.key !== "ArrowLeft" && event.key !== "ArrowRight" && event.key !== "Home" && event.key !== "End") return;
      event.preventDefault();
      const width = agentPanel.getBoundingClientRect().width;
      setAgentPanelWidth(event.key === "Home" ? 0 : event.key === "End" ? window.innerWidth : width + (event.key === "ArrowLeft" ? 20 : -20));
    });
    window.addEventListener("resize", () => setAgentPanelWidth(agentPanel.getBoundingClientRect().width));
    setAgentPanelWidth(agentPanel.getBoundingClientRect().width);

    resizeCanvas();
    focusColony();
    spawnAgent(false);
    setInterval(updateColonyPanel, 200);
    updateColonyPanel();
    requestAnimationFrame(render);
  </script>
</body>
</html>
