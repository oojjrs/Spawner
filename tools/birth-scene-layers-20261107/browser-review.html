<!doctype html><html lang="ko"><meta charset="utf-8"><title>탄생 14종 고해상도 검수</title><style>body{font:15px system-ui;background:#e9e4d8;color:#25372b;margin:18px}h1{font-size:22px}button,select{padding:8px;margin:3px;font:inherit}canvas{background:#fff9ed;border:1px solid #b8b29f;max-width:100%}#status{white-space:pre-wrap;padding:12px}label{display:inline-block}small{display:block}</style><h1>탄생 14종 · 실제 게임 공통 렌더러</h1><p>전체 장면과 몸체 확대, 기존 시간·좌우·다수 동시 탄생·실패 대체 경로 검수</p><label>외형 <select id="form"></select></label><label>모드 <select id="mode"><option value="layers">고해상도 두 트랙</option><option value="failure">트랙 실패 → 기존 장면</option></select></label><label>동시 탄생 <select id="count"><option>1</option><option>4</option><option>16</option></select></label><button id="mirror">좌우 전환</button><button id="pause">일시정지</button><button id="replay">다시 재생</button><button id="scan">14종 순차 확인</button><br><button data-phase="0">시작</button><button data-phase="0.55">등장</button><button data-phase="0.85">착지</button><button data-phase="0.99999">끝</button><div id="status" role="status">준비 중</div><canvas id="scene" width="800" height="440"></canvas><canvas id="detail" width="350" height="440"></canvas><small>왼쪽: 전체 장면. 오른쪽: 최종 몸체 기준 확대. DOM 상태에는 로드·프레임·그리기 비용과 검수 결과를 표시합니다.</small><script type="module">
import {ANTENNA_COMBO_ACTION_ART} from './client/antenna-combo-assets.mjs';
import {createUnitActionArt,unitActionArtPose} from './client/unit-action-art.mjs';
import {unitDisplaySize} from './client/unit-size.mjs';
const $=id=>document.getElementById(id),keys=Object.keys(ANTENNA_COMBO_ACTION_ART).filter(key=>ANTENNA_COMBO_ACTION_ART[key].actions.birth.sceneLayers),names={bean:'새싹콩',spore:'포자버섯'};
$('form').innerHTML=keys.map(key=>`<option value="${key}">${names[key.split('/')[0]]} ${key.split('/')[1]}</option>`).join('');
let lastPaint='',art,agent,clip,begin=performance.now(),phase=null,mirror=false,loading=false,requested=[],loaded=[],failed=[],revision=0,draws=0,totalCost=0,maxCost=0,scanResult='';
const surface=(width,height)=>Object.assign(document.createElement('canvas'),{width,height});
async function choose(){const token=++revision;loading=true;const key=$('form').value,[tribe,form]=key.split('/');clip=ANTENNA_COMBO_ACTION_ART[key].actions.birth;agent={tribe,attributes:Object.fromEntries(form.split('-').map(key=>[key,1])),health:10,birth:{startedAt:0,readyAt:clip.durationMs/1000}};requested=[];loaded=[];failed=[];draws=totalCost=maxCost=0;
 const mode=$('mode').value;art=createUnitActionArt(x=>x,surface,async path=>{requested.push(path);if(mode==='failure'&&path.includes('/BirthSceneLayersV1/')){failed.push(path);throw Error('QA simulated layer load failure')}const image=new Image();image.src=path;await image.decode();loaded.push(path);return image});
 await art.prepare(agent,0);if(token!==revision)return;loading=false;begin=performance.now();phase=.99999;$('pause').textContent='재생';}
$('form').onchange=choose;$('mode').onchange=choose;$('mirror').onclick=()=>mirror=!mirror;$('count').onchange=()=>{draws=totalCost=maxCost=0};$('pause').onclick=()=>{phase=phase===null?((performance.now()-begin)%clip.durationMs)/clip.durationMs:null;if(phase===null)begin=performance.now();$('pause').textContent=phase===null?'일시정지':'재생'};$('replay').onclick=()=>{phase=null;begin=performance.now();$('pause').textContent='일시정지'};for(const button of document.querySelectorAll('[data-phase]'))button.onclick=()=>{phase=Number(button.dataset.phase);$('pause').textContent='재생'};
$('scan').onclick=async()=>{const outcomes=[];$('scan').disabled=true;for(const key of keys){$('form').value=key;await choose();phase=.99999;const ctx=$('scene').getContext('2d');let ok=art.readyFrame(agent,clip.durationMs/1000*.99999);for(const p of [0,.2,.55,.85,.99999])for(const side of [false,true])ok=ok&&art.draw(ctx,agent,p*clip.durationMs/1000,500,370,160,side);outcomes.push(key+': '+(ok?'PASS':'FAIL'));scanResult=outcomes.join('\n');await new Promise(requestAnimationFrame)}$('scan').disabled=false;};
function paint(now){if(clip){const t=(phase===null?(now-begin)%clip.durationMs:phase*clip.durationMs)/1000;const count=Number($('count').value);const signature=[revision,unitActionArtPose(agent,t).frame,mirror,count,loading].join('/');if(signature===lastPaint){requestAnimationFrame(paint);return}lastPaint=signature;const start=performance.now();for(const id of ['scene','detail']){const canvas=$(id),ctx=canvas.getContext('2d');ctx.clearRect(0,0,canvas.width,canvas.height);ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';if(!loading){if(id==='detail')art.draw(ctx,agent,t,175,380,320,mirror);else{const cols=count===1?1:count===4?2:4,rows=cols,w=800/cols,h=440/rows,scale=Math.min(w/(clip.frameSize+30),h/(clip.frameHeight+25));for(let n=0;n<count;n++){const originX=n%cols*w+(w-clip.frameSize*scale)/2,originY=Math.floor(n/cols)*h;art.draw(ctx,agent,t,originX+(mirror?clip.frameSize-clip.pivotX:clip.pivotX)*scale,originY+clip.pivotY*scale,scale*clip.referenceLength/unitDisplaySize(agent),mirror);}}}}const cost=performance.now()-start;draws++;totalCost+=cost;maxCost=Math.max(maxCost,cost);const pose=unitActionArtPose(agent,t);$('status').textContent=`${$('form').value} | ${loading?'LOADING':art.readyFrame(agent,t)?'READY':'WAITING'} | frame ${pose.frame+1}/${clip.frameCount} | ${Math.round(t*1000)}/${clip.durationMs}ms | ${mirror?'left':'right'}\n${count} births + detail | draw mean ${(totalCost/draws).toFixed(2)}ms, max ${maxCost.toFixed(2)}ms, samples ${draws}\nLoaded ${loaded.length}, failed ${failed.length}, requested ${requested.length} | ${loaded.some(x=>x.endsWith('/birth.png'))?'BAKED FALLBACK':'LAYERS ONLY'}\n${scanResult}`;}requestAnimationFrame(paint)}
await choose();requestAnimationFrame(paint);
</script></html>
