<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spawner Design</title>
<script>document.documentElement.classList.add("page-mode")</script>
<style>
:root{color-scheme:dark;--bg:#101315;--paper:#1b2023;--ink:#e4e9ea;--muted:#9aa7aa;--line:#314044;--accent:#75c4b6;--soft:rgba(117,196,182,.12);font-family:"Pretendard","Noto Sans KR","Malgun Gothic",system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);line-height:1.62}header{position:sticky;top:0;z-index:3;padding:20px 28px;border-bottom:1px solid #ffffff14;background:#101315f0}h1,p{margin:0}h1{font-size:clamp(1.5rem,2.2vw,2.35rem)}header p{margin-top:4px;color:var(--muted)}.layout{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:calc(100vh - 96px)}.side-nav{position:sticky;top:96px;align-self:start;height:calc(100vh - 96px);overflow:auto;padding:24px;border-right:1px solid #ffffff14;background:#14171ad1}.nav-group{margin-bottom:18px;padding-bottom:18px;border-bottom:1px solid #ffffff14}.nav-group-title{display:block;margin-bottom:8px;color:var(--accent);font-size:.82rem;font-weight:800}.nav-items{display:grid;gap:4px}.nav-items a{padding:7px 9px;border-radius:6px;color:var(--muted);font-size:.92rem;text-decoration:none}.nav-items a:hover,.nav-items a.is-active{color:var(--ink);background:var(--soft)}main{min-width:0;background:var(--paper)}.section-group{margin:0}.page-mode .section-group{display:none}.page-mode .section-group.is-page-active{display:block}.section-group>summary{padding:30px clamp(24px,4vw,56px) 18px;border-bottom:1px solid var(--line);font-size:1.34rem;font-weight:900;list-style:none}.section-group-body{padding:10px clamp(24px,4vw,56px) 42px}.page-mode .section-group-body>details{display:none}.page-mode .section-group-body>details.is-page-active{display:block}.section-group-body>details{border-top:1px solid var(--line)}.section-group-body>details>summary{padding:18px 0 14px;font-size:1.12rem;font-weight:850;list-style:none}.details-body{display:grid;gap:16px;padding-bottom:24px}.lead{font-size:1.04rem}.rule{display:grid;gap:8px;margin:0;padding:0;list-style:none}.rule li{padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:#ffffff09}.rule strong,th{color:var(--accent)}.term{display:inline-grid;place-items:center;width:1.15em;height:1.15em;margin-left:4px;border:1px solid var(--accent);border-radius:50%;color:var(--accent);font-size:.72em;font-weight:900}.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}table{width:100%;min-width:620px;border-collapse:collapse}th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{background:#ffffff0a}tr:last-child td{border-bottom:0}.asset-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}.asset-card{margin:0}.asset-card figcaption{margin-top:6px;color:var(--muted);font-size:.88rem}.reference-image{display:block;width:100%;max-width:320px;height:auto;border:1px solid var(--line);border-radius:8px;background:#0f1517}.note{color:var(--muted)}.lightbox{position:fixed;inset:0;z-index:10;display:none;place-items:center;padding:28px;background:#050708c9}.lightbox.is-open{display:grid}.lightbox-panel{max-width:min(92vw,980px);max-height:88vh;padding:14px;border:1px solid var(--line);border-radius:12px;background:#151b1edf;box-shadow:0 24px 80px #000b}.lightbox-header{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:10px;color:var(--muted);font-size:.9rem}.lightbox-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lightbox-close{width:30px;height:30px;border:1px solid var(--line);border-radius:999px;background:#ffffff0a;color:var(--ink);cursor:pointer}.lightbox-close:hover{background:var(--soft)}.lightbox-image{display:block;max-width:calc(92vw - 30px);max-height:calc(88vh - 72px);border-radius:8px;background:#0f1517;object-fit:contain}@media(max-width:900px){.layout{grid-template-columns:1fr}.side-nav{position:static;height:auto;border-right:0;border-bottom:1px solid #ffffff14}}
</style>
</head>
<body>
<header><h1>Spawner</h1><p>유닛을 직접 설계하고 생명체를 탄생시켜 군락을 번성시키는 전략 게임</p></header>
<div class="layout">
<nav class="side-nav" aria-label="기획 문서 목차">
<div class="nav-group" data-section-group="core"><span class="nav-group-title">핵심</span><div class="nav-items"><a href="#direction">방향</a></div></div>
</nav>
<main>
<details class="section-group" data-section-group="core"><summary>핵심</summary><div class="section-group-body">
<details id="direction"><summary>방향</summary><div class="details-body"><ul class="rule"><li>속성을 조합해 유닛 템플릿을 만들고 군락을 번성시키는 전략 게임이다.</li><li>첫 화면은 개체 없이 둥지만 있으며 첫 생명체부터 직접 설계한다.</li><li>이름 붙인 설계로 개체를 탄생시키고 채집·운반·방어를 관찰한다.</li><li>개체 생산과 둥지 성장에 진화 포인트를 나눠 쓴다.</li><li>군락과 월드의 시뮬레이션은 브라우저 클라이언트에서 실행한다.</li></ul></div></details>
</div></details>
</main>
</div>
<div class="lightbox" id="image-lightbox" aria-hidden="true">
<div class="lightbox-panel" role="dialog" aria-modal="true" aria-label="이미지 미리보기">
<div class="lightbox-header"><span class="lightbox-title" id="lightbox-title"></span><button class="lightbox-close" type="button" aria-label="닫기">×</button></div>
<img class="lightbox-image" alt="">
</div>
</div>
<script>
(()=>{const links=[...document.querySelectorAll(".nav-items a")],groups=[...document.querySelectorAll(".section-group")],fallback=links[0]?.hash||"";function activate(hash){const target=document.getElementById((hash||fallback).replace(/^#/,""));if(!target)return;const activeGroup=target.closest(".section-group");groups.forEach(group=>{const active=group===activeGroup;group.open=active;group.classList.toggle("is-page-active",active);group.querySelectorAll(".section-group-body>details").forEach(page=>{const selected=active&&page===target;page.open=selected;page.classList.toggle("is-page-active",selected)})});links.forEach(link=>link.classList.toggle("is-active",link.hash===`#${target.id}`))}links.forEach(link=>link.addEventListener("click",event=>{event.preventDefault();history.pushState(null,"",link.hash);activate(link.hash)}));document.querySelectorAll("summary").forEach(summary=>summary.addEventListener("click",event=>event.preventDefault()));window.addEventListener("hashchange",()=>activate(location.hash));activate(location.hash||fallback);const lightbox=document.getElementById("image-lightbox"),lightboxImage=lightbox?.querySelector(".lightbox-image"),lightboxTitle=document.getElementById("lightbox-title"),closeButton=lightbox?.querySelector(".lightbox-close");function closeLightbox(){if(!lightbox||!lightboxImage)return;lightbox.classList.remove("is-open");lightbox.setAttribute("aria-hidden","true");lightboxImage.removeAttribute("src");lightboxImage.alt=""}document.querySelectorAll(".asset-card a[href], figure a[href]").forEach(link=>{const image=link.querySelector("img");if(!image)return;link.addEventListener("click",event=>{event.preventDefault();if(!lightbox||!lightboxImage)return;const source=link.getAttribute("href");lightboxImage.src=source;lightboxImage.alt=image.alt||"";if(lightboxTitle)lightboxTitle.textContent=source;lightbox.classList.add("is-open");lightbox.setAttribute("aria-hidden","false");closeButton?.focus()})});closeButton?.addEventListener("click",closeLightbox);lightbox?.addEventListener("click",event=>{if(event.target===lightbox)closeLightbox()});window.addEventListener("keydown",event=>{if(event.key==="Escape"&&lightbox?.classList.contains("is-open"))closeLightbox()})})();
</script>
</body>
</html>
